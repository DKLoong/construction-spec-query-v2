<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 规范智能检索与问答系统</title>
    <link rel="stylesheet" href="/static/pico.min.css">
    <link rel="stylesheet" href="/static/pico.custom.css?v=1">
    <link rel="stylesheet" href="/static/app.css?v=57">
</head>
<body class="login-body">
    <main class="container" style="max-width: 400px; margin-top: 10vh;">
        <h1>规范智能检索与问答系统</h1>
        {% if error %}
        <article style="background: #fee; color: #c00;">{{ error }}</article>
        {% endif %}
        <form method="post">
            <label>用户名 <input type="text" name="username" required autofocus></label>
            <label>密码 <input type="password" name="password" required></label>
            <button type="submit">登 录</button>
        </form>
    </main>
    <footer class="app-footer">
        本工具规范资料取自公开渠道，仅供个人学习，禁止商用，侵权请联系删除；OCR 识别可能存在错漏，检索及 AI 回复仅作参考，不得作为专业评估、工程决策依据，请以官方规范原文为准。
    </footer>
</body>
</html>
