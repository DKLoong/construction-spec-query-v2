<!-- 中栏：词库管理（三 Tab：同义词 / 别名 / 易混淆） -->
<script>
function lexiconDistCount(textarea, spanId) {
    document.getElementById(spanId).textContent = textarea.value.length;
}
function lexiconPickFile(input) {
    document.getElementById('lexicon-file-name').value =
        (input.files && input.files.length) ? input.files[0].name : '';
}
// 导入进度：点上传导入后按钮平滑向右填充并禁用，请求结束归零恢复
function lexiconImportStart() {
    var b = document.getElementById('lexicon-import-btn');
    if (!b || b.disabled) return;
    b.disabled = true;
    b.setAttribute('data-importing', '1');
    var f = document.getElementById('lexicon-import-fill');
    f.style.transition = 'width .1s linear';
    f.style.width = '12%';
    requestAnimationFrame(function () {
        requestAnimationFrame(function () { f.style.width = '88%'; });
    });
}
document.addEventListener('htmx:afterRequest', function () {
    var b = document.getElementById('lexicon-import-btn');
    if (!b || b.getAttribute('data-importing') !== '1') return;
    var f = document.getElementById('lexicon-import-fill');
    f.style.width = '100%';
    setTimeout(function () {
        f.style.transition = 'none';
        f.style.width = '0%';
        b.removeAttribute('data-importing');
        b.disabled = false;
    }, 260);
});
</script>
<div x-data="{ kind: 'synonym' }" style="padding:1rem">
    <!-- 当前 kind 单一来源：供添加/导入表单 hx-include 与列表自动刷新带参 -->
    <input type="hidden" id="lexicon-kind-input" name="kind" :value="kind">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.5rem">
        <h2 style="margin:0">📖 词库</h2>
        <small style="color:var(--pico-muted-color)">同义/别名只扩 FTS 检索；易混淆仅提示不改写（向量不替换原词）</small>
    </div>
    <!-- Tab 切换：设 Alpine kind（驱动表单）+ 立即 hx-get 刷新列表 -->
    <div style="display:flex;gap:0.5rem;margin:0.8rem 0;flex-wrap:wrap">
        <button class="outline" style="font-size:0.8rem" :class="kind==='synonym'?'contrast':''"
                @click="kind='synonym'" hx-get="/lexicon/list?kind=synonym" hx-target="#lexicon-table" hx-swap="innerHTML">🔄 同义词</button>
        <button class="outline" style="font-size:0.8rem" :class="kind==='alias'?'contrast':''"
                @click="kind='alias'" hx-get="/lexicon/list?kind=alias" hx-target="#lexicon-table" hx-swap="innerHTML">🏷 别名</button>
        <button class="outline" style="font-size:0.8rem" :class="kind==='confusable'?'contrast':''"
                @click="kind='confusable'" hx-get="/lexicon/list?kind=confusable" hx-target="#lexicon-table" hx-swap="innerHTML">⚠️ 易混淆术语</button>
    </div>

    <!-- 新增表单（synonym/alias：代表词+变体，单行、右对齐、紧凑添加键） -->
    <form x-show="kind!=='confusable'" hx-post="/lexicon/create" hx-target="#create-result"
          hx-swap="innerHTML" hx-include="#lexicon-kind-input"
          hx-on::after-request="if(event.detail.successful) this.reset()">
        <div style="display:flex;align-items:center;gap:0.4rem;flex-wrap:nowrap">
            <label style="margin:0;white-space:nowrap;flex:none;font-size:0.85rem"><span x-text="kind==='alias'?'规范词':'代表词'"></span></label>
            <input type="text" name="canonical" required style="width:120px;height:38px;margin:0;flex:none;box-sizing:border-box">
            <label style="margin:0;white-space:nowrap;flex:none;font-size:0.85rem">变体/俗称(逗号分隔)</label>
            <input type="text" name="variants" placeholder="如 砼,混泥土" required style="width:190px;height:38px;margin:0;flex:none;box-sizing:border-box">
            <button type="submit" class="secondary"
                    style="height:38px;min-width:0;width:auto;padding:0 0.6rem;margin:0 0 0 auto;flex:none;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center">添加</button>
        </div>
    </form>
    <!-- 新增表单（confusable：词A + 词B + 区分说明 textarea≤50字；按钮与左侧输入框基线对齐） -->
    <form x-show="kind==='confusable'" hx-post="/lexicon/create" hx-target="#create-result"
          hx-swap="innerHTML" hx-include="#lexicon-kind-input"
          hx-on::after-request="if(event.detail.successful){ this.reset(); document.getElementById('lexicon-add-dist-count').textContent='0'; }">
        <div style="display:flex;align-items:flex-start;gap:0.4rem;flex-wrap:nowrap">
            <label style="margin:0;white-space:nowrap;flex:none;font-size:0.85rem;line-height:38px">词A</label>
            <input type="text" name="canonical" required style="width:96px;height:38px;margin:0;flex:none;box-sizing:border-box">
            <label style="margin:0;white-space:nowrap;flex:none;font-size:0.85rem;line-height:38px">词B</label>
            <input type="text" name="variants" required style="width:96px;height:38px;margin:0;flex:none;box-sizing:border-box">
            <div style="display:flex;flex-direction:column;gap:2px;flex:none">
                <textarea name="distinguish" id="lexicon-add-distinguish" rows="2" maxlength="50" required
                          placeholder="区分说明（必填，≤50 字）"
                          oninput="lexiconDistCount(this, 'lexicon-add-dist-count')"
                          style="width:280px;height:44px;margin:0;box-sizing:border-box;font-size:0.8rem;line-height:1.3;resize:vertical;overflow:auto"></textarea>
                <div style="align-self:flex-end;font-size:0.7rem;color:var(--pico-muted-color);line-height:1">
                    <span id="lexicon-add-dist-count">0</span>/50
                </div>
            </div>
            <button type="submit" class="secondary"
                    style="height:38px;min-width:0;width:auto;padding:0 0.6rem;margin:0 0 0 auto;flex:none;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center">添加</button>
        </div>
    </form>
    <div id="create-result"></div>

    <!-- CSV 导入 + 下载模板（同一行；kind 空时按当前 Tab 兜底） -->
    <div style="margin:0.8rem 0;display:flex;align-items:center;gap:0.5rem;flex-wrap:nowrap">
        <label style="margin:0;white-space:nowrap;flex:none;font-size:0.85rem">批量导入 CSV：</label>
        <button type="button" class="outline" onclick="document.getElementById('lexicon-file').click()"
                style="height:34px;width:96px;margin:0;flex:none;padding:0;white-space:nowrap;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center">选择文件</button>
        <input type="text" id="lexicon-file-name" readonly placeholder="未选择文件"
               style="flex:1;min-width:140px;height:34px;margin:0;box-sizing:border-box">
        <button type="submit" form="lexicon-import-form" id="lexicon-import-btn" class="outline"
                onclick="setTimeout(lexiconImportStart, 0)"
                style="position:relative;height:34px;width:96px;margin:0;flex:none;padding:0;white-space:nowrap;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;overflow:hidden">
            <span id="lexicon-import-fill"
                  style="position:absolute;left:0;top:0;bottom:0;width:0%;background:linear-gradient(90deg,rgba(13,110,253,.18),rgba(13,110,253,.35))"></span>
            <span style="position:relative">上传导入</span>
        </button>
        <a href="/lexicon/template.csv" class="outline"
           style="height:34px;width:96px;margin:0;flex:none;padding:0;white-space:nowrap;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;text-decoration:none">下载模板</a>
        <form id="lexicon-import-form" hx-post="/lexicon/import" hx-target="#import-result" hx-swap="innerHTML"
              hx-encoding="multipart/form-data" hx-include="#lexicon-kind-input" style="display:none">
            <input type="file" id="lexicon-file" name="file" accept=".csv"
                   onchange="lexiconPickFile(this)">
        </form>
    </div>
    <div id="import-result"></div>

    <!-- 列表：load/增删启禁(lexiconUpdated)后按当前 kind(hidden)自动重拉 -->
    <div id="lexicon-table" hx-get="/lexicon/list" hx-include="#lexicon-kind-input"
         hx-trigger="load, lexiconUpdated from:body" style="margin-top:0.6rem"></div>
</div>
