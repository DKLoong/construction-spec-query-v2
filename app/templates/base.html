<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>施工规范查询系统 V2</title>
    <link rel="stylesheet" href="/static/pico.min.css">
    <link rel="stylesheet" href="/static/pico.custom.css">
    <link rel="stylesheet" href="/static/app.css?v=13">
    <link rel="stylesheet" href="/static/katex/katex.min.css">
    <script src="/static/htmx.min.js"></script>
    <script src="/static/alpine.min.js" defer></script>
    <script src="/static/marked.min.js"></script>
    <script src="/static/purify.min.js"></script>
</head>
<body>
    <div x-data="appLayout()" class="app-layout{% if hide_tree %} full-width{% endif %}" @open-qa-modal="openQA()">
        {% if not hide_tree %}
        <aside class="left-panel">
            {% if left_content %}{% include left_content %}{% endif %}
        </aside>
        {% endif %}
        <main class="center-panel-v2">
            {% if center_content %}{% include center_content %}{% endif %}
        </main>
    </div>
    <script>
        function appLayout() {
            return {
                sidebarCollapsed: false,
                qaCollapsed: false,
                toggleSidebar() { this.sidebarCollapsed = !this.sidebarCollapsed; },
                openQA() {
                    const modal = document.getElementById('qa-modal-overlay');
                    if (modal) modal.style.display = 'flex';
                },
                closeQA() {
                    const modal = document.getElementById('qa-modal-overlay');
                    if (modal) modal.style.display = 'none';
                },
                openSettings() {
                    window.dispatchEvent(new CustomEvent('open-settings'));
                },
            }
        }
    </script>
    <!-- AI 问答弹窗（非常驻） -->
    <div id="qa-modal-overlay" class="qa-modal-overlay" style="display:none"
         onclick="if(event.target===this)this.style.display='none'">
        <div class="qa-modal-box">
            <div class="qa-modal-header">
                <span>🤖 AI 智能问答</span>
                <div style="display:flex;gap:0.5rem;align-items:center">
                    <button style="background:none;border:none;cursor:pointer;font-size:1rem;padding:0;line-height:1"
                            onclick="window.dispatchEvent(new CustomEvent('open-settings', {detail:{tab:'ai'}}))"
                            title="AI 设置"
                            aria-label="AI 设置">⚙️</button>
                    <button class="qa-modal-close"
                            onclick="document.getElementById('qa-modal-overlay').style.display='none'"
                            aria-label="关闭">&times;</button>
                </div>
            </div>
            <div class="qa-modal-body">
                {% include "partials/qa_panel.html" %}
            </div>
        </div>
    </div>
    <!-- 设置弹窗 -->
    {% include "partials/settings_dialog.html" %}
    <!-- 条文详情弹窗（纯 JS 控制显示/隐藏，不依赖 Alpine 可见性控制） -->
    <div id="clause-modal-overlay" class="clause-modal-overlay" style="display:none">
        <div class="clause-modal-box">
            <div class="clause-modal-header">
                <span class="clause-modal-title">📋 条文详情</span>
                <button onclick="window.closeClauseModal()" class="clause-modal-close" aria-label="关闭">&times;</button>
            </div>
            <div class="clause-modal-body">
                <div class="clause-modal-loading" style="display:none">加载中...</div>
                <div id="clause-modal-content"></div>
            </div>
        </div>
    </div>
    <script src="/static/katex/katex.min.js"></script>
    <script src="/static/katex/contrib/auto-render.min.js"></script>
    <script src="/static/components/md-render.js?v=13"></script>
    <script src="/static/components/clause-modal.js?v=11"></script>
    <script src="/static/components/settings.js?v=3"></script>
    <script src="/static/components/tree.js?v=1"></script>
    <script src="/static/components/qa.js?v=14"></script>
    <script src="/static/components/search.js?v=1"></script>
    <script src="/static/components/import.js"></script>
</body>
</html>
