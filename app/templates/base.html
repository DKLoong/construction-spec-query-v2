<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>施工规范查询系统 V2</title>
    <link rel="stylesheet" href="/static/pico.min.css">
    <link rel="stylesheet" href="/static/pico.custom.css?v=1">
    <link rel="stylesheet" href="/static/app.css?v=31">
    <link rel="stylesheet" href="/static/katex/katex.min.css">
    <script src="/static/htmx.min.js"></script>
    <script src="/static/alpine.min.js" defer></script>
    <script src="/static/marked.min.js"></script>
    <script src="/static/purify.min.js"></script>
</head>
<body>
    <div x-data="appLayout()" class="app-layout{% if hide_tree %} full-width{% endif %}">
        {% if not hide_tree %}
        <aside class="left-panel">
            {% if left_content %}{% include left_content %}{% endif %}
        </aside>
        {% endif %}
        <main class="center-panel-v2">
            {% if center_content %}{% include center_content %}{% endif %}
        </main>
    </div>
    <script>
        function appLayout() {
            return {
                sidebarCollapsed: false,
                toggleSidebar() { this.sidebarCollapsed = !this.sidebarCollapsed; },
                openSettings() {
                    window.dispatchEvent(new CustomEvent('open-settings'));
                },
            }
        }
    </script>
    <!-- 设置弹窗 -->
    {% include "partials/settings_dialog.html" %}
    <!-- 条文详情弹窗（纯 JS 控制显示/隐藏，不依赖 Alpine 可见性控制） -->
    <div id="clause-modal-overlay" class="clause-modal-overlay" style="display:none">
        <div class="clause-modal-box">
            <div class="clause-modal-header">
                <span class="clause-modal-title">📋 条文详情</span>
                <button onclick="window.closeClauseModal()" class="clause-modal-close" aria-label="关闭">&times;</button>
            </div>
            <div class="clause-modal-body" id="clause-modal-body">
                <div class="clause-modal-loading" style="display:none">加载中...</div>
                <div id="clause-modal-content"></div>
            </div>
            <!-- 底部翻页条：仅当打开时携带翻页上下文（来源列表的 id 序列）才显示 -->
            <div class="clause-modal-footer" id="clause-modal-footer" style="display:none">
                <button type="button" id="clause-nav-prev" class="outline">‹ 上一条</button>
                <span id="clause-nav-count" class="clause-nav-count"></span>
                <button type="button" id="clause-nav-next" class="outline">下一条 ›</button>
            </div>
        </div>
    </div>
    <!-- 输入框聚焦提示的落点（全局单例，position:fixed，见 field-hint.js 顶部说明） -->
    <div id="field-hint-pop" class="field-hint-pop" style="display:none"></div>
    <script src="/static/katex/katex.min.js"></script>
    <script src="/static/katex/contrib/auto-render.min.js"></script>
    <script src="/static/components/md-render.js?v=13"></script>
    <script src="/static/components/clause-modal.js?v=12"></script>
    <script src="/static/components/settings.js?v=3"></script>
    <script src="/static/components/tree.js?v=7"></script>
    <script src="/static/components/qa.js?v=28"></script>
    <script src="/static/components/search.js?v=13"></script>
    <script src="/static/components/rebuild.js?v=1"></script>
    <script src="/static/components/import.js?v=5"></script>
    <script src="/static/components/specs.js?v=4"></script>
    <script src="/static/components/field-hint.js?v=2"></script>
</body>
</html>
