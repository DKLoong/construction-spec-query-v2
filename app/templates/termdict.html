<!-- 中栏：术语/维度权威词典（dim4/5/6 三 Tab CRUD；权威标签=写库值，词面=识别/候选用） -->
<div x-data="{ dimension: 'dim6' }" style="padding:1rem">
    <input type="hidden" id="termdict-dim-input" name="dimension" :value="dimension">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.5rem">
        <h2 style="margin:0">📚 术语 / 维度词典</h2>
        <small style="color:var(--pico-muted-color)">权威标签是 dim4/5/6 唯一合法分类值；规则/AI 命中词典外标签会转审核（人工确认后自动入典）</small>
    </div>
    <div style="display:flex;gap:0.5rem;margin:0.8rem 0;flex-wrap:wrap">
        <button class="outline" style="font-size:0.8rem" :class="dimension==='dim6'?'contrast':''"
                @click="dimension='dim6'" hx-get="/termdict/list?dimension=dim6" hx-target="#termdict-table" hx-swap="innerHTML">🧱 材料/工艺</button>
        <button class="outline" style="font-size:0.8rem" :class="dimension==='dim5'?'contrast':''"
                @click="dimension='dim5'" hx-get="/termdict/list?dimension=dim5" hx-target="#termdict-table" hx-swap="innerHTML">🏗 工程部位</button>
        <button class="outline" style="font-size:0.8rem" :class="dimension==='dim4'?'contrast':''"
                @click="dimension='dim4'" hx-get="/termdict/list?dimension=dim4" hx-target="#termdict-table" hx-swap="innerHTML">🛠 所属专业</button>
    </div>
    <form hx-post="/termdict/create" hx-target="#create-result" hx-swap="innerHTML"
          hx-include="#termdict-dim-input"
          hx-on::after-request="if(event.detail.successful) this.reset()">
        <div style="display:flex;align-items:center;gap:0.4rem;flex-wrap:nowrap">
            <label style="margin:0;white-space:nowrap;flex:none;font-size:0.85rem">权威标签</label>
            <input type="text" name="label" required placeholder="写库值，如 钢筋" style="width:130px;height:38px;margin:0;flex:none;box-sizing:border-box">
            <label style="margin:0;white-space:nowrap;flex:none;font-size:0.85rem">代表词</label>
            <input type="text" name="canonical" required placeholder="识别词面，如 钢筋" style="width:120px;height:38px;margin:0;flex:none;box-sizing:border-box">
            <label style="margin:0;white-space:nowrap;flex:none;font-size:0.85rem">同义词面</label>
            <input type="text" name="aliases" placeholder="逗号分隔，可空" style="width:140px;height:38px;margin:0;flex:none;box-sizing:border-box">
            <label style="margin:0;white-space:nowrap;flex:none;font-size:0.85rem">备注</label>
            <input type="text" name="note" placeholder="可空" style="width:100px;height:38px;margin:0;flex:none;box-sizing:border-box">
            <button type="submit" class="secondary"
                    style="height:38px;min-width:0;width:auto;padding:0 0.6rem;margin:0 0 0 auto;flex:none;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center">添加</button>
        </div>
    </form>
    <div id="create-result"></div>
    <div id="termdict-table" hx-get="/termdict/list" hx-include="#termdict-dim-input"
         hx-trigger="load, termdictUpdated from:body" style="margin-top:0.6rem"></div>
</div>
