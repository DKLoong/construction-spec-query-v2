<!-- 词条行内编辑：分列输入框与列头对齐；保存/取消为两字小按钮、垂直居中于操作列 -->
<tr id="lexicon-edit-{{ row.id }}" style="vertical-align:middle">
    <td style="vertical-align:middle">
        <input type="text" name="canonical" form="lexicon-edit-form-{{ row.id }}" value="{{ row.canonical }}" required
               style="width:100%;min-width:96px;height:32px;margin:0;box-sizing:border-box;font-size:0.8rem">
    </td>
    <td style="vertical-align:middle">
        <input type="text" name="variants" form="lexicon-edit-form-{{ row.id }}" value="{{ row.variants }}" required
               style="width:100%;min-width:120px;height:32px;margin:0;box-sizing:border-box;font-size:0.8rem">
    </td>
    {% if kind == 'confusable' %}
    <td style="vertical-align:middle">
        <textarea name="distinguish" form="lexicon-edit-form-{{ row.id }}" rows="2" maxlength="50" required
                  oninput="lexiconDistCount(this, 'lexicon-edit-dist-count-{{ row.id }}')"
                  style="width:100%;min-width:200px;height:44px;margin:0;box-sizing:border-box;font-size:0.8rem;line-height:1.3;resize:vertical;overflow:auto">{{ row.distinguish }}</textarea>
        <div style="font-size:0.7rem;color:var(--pico-muted-color);line-height:1;text-align:right">
            <span id="lexicon-edit-dist-count-{{ row.id }}">{{ row.distinguish|length }}</span>/50
        </div>
    </td>
    {% endif %}
    <td style="text-align:center;vertical-align:middle">{{ '启用' if row.is_active else '禁用' }}</td>
    <td style="text-align:left;vertical-align:middle;white-space:nowrap">
        <form id="lexicon-edit-form-{{ row.id }}" style="margin:0;display:inline-flex;gap:0.3rem"
              hx-post="/lexicon/{{ row.id }}/edit" hx-target="closest tr" hx-swap="outerHTML"
              hx-on::after-request="if(event.detail.successful) document.body.dispatchEvent(new Event('lexiconUpdated'))">
            <button type="submit" class="secondary"
                    style="height:26px;min-width:44px;margin:0;padding:0 0.3rem;font-size:0.75rem;white-space:nowrap">保存</button>
            <button type="button" class="outline"
                    style="height:26px;min-width:44px;margin:0;padding:0 0.3rem;font-size:0.75rem;white-space:nowrap"
                    hx-get="/lexicon/list?kind={{ kind }}&active={{ row.is_active }}"
                    hx-target="#lexicon-table" hx-swap="innerHTML">取消</button>
        </form>
    </td>
</tr>
