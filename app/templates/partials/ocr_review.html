<!-- OCR 审查页面 -->
<div x-data="ocrReview()" class="ocr-review">
    <h2>📝 OCR 审查 <small x-text="fileName" style="color:var(--pico-muted-color);font-size:0.8rem"></small></h2>

    <!-- 搜索/替换工具栏：所有控件同一行、统一高度 36px、基线对齐（样式见 app.css .review-toolbar） -->
    <div class="review-toolbar">
        <input type="search" x-model="searchQuery" @input="findMatches()"
               placeholder="搜索..." style="width:200px">
        <small x-text="matchInfo" style="color:var(--pico-muted-color);min-width:60px"></small>
        <button class="outline" @click="prevMatch()" :disabled="!hasMatches" style="font-size:0.8rem">◀ 上一个</button>
        <button class="outline" @click="nextMatch()" :disabled="!hasMatches" style="font-size:0.8rem">下一个 ▶</button>
        <input type="text" x-model="replaceText" placeholder="替换为..." style="width:180px">
        <button class="secondary outline" @click="replaceCurrent()" :disabled="!hasMatches" style="font-size:0.8rem">替换</button>
        <button class="secondary outline" @click="replaceAll()" :disabled="!hasMatches" style="font-size:0.8rem">全部替换</button>
    </div>

    <!-- 左右双栏：编辑 | 预览 -->
    <div class="review-panels">
        <textarea x-model="mdContent" @input="updatePreview()" @scroll="syncScroll($event)"
                  class="review-editor" spellcheck="false"></textarea>
        <div x-html="renderedHtml" class="review-preview" id="review-preview"></div>
    </div>

    <!-- 确认 / 取消（与双栏保持 30px 间距，样式在 .review-panels margin 基础上由本行 margin-top 提供） -->
    <div style="margin-top:30px;padding-top:1rem;border-top:1px solid var(--pico-muted-border-color);
                display:flex;justify-content:space-between;align-items:center">
        <small style="color:var(--pico-muted-color)">审查完毕后点击确认继续导入流程（解析 + 分类 + 索引）</small>
        <div style="display:flex;gap:0.75rem;align-items:center">
            {# md 走 raw body 由 confirmImport() 以 fetch 提交：表单字段有 1MB 上限，
               大规范（md 46 万字符）会被 400 拒掉且页面毫无反应 #}
            {# 防重复提交：提交中叠加白蒙版遮罩并禁用（同「开始导入」方案） #}
            <span style="position:relative;display:inline-flex;align-items:center">
                <span x-show="submitting" x-cloak
                      style="position:absolute;inset:0;background:rgba(255,255,255,.55);
                             border:1px dashed var(--pico-muted-border-color);border-radius:6px;
                             z-index:2;"></span>
                <button type="button" style="position:relative;z-index:1;margin:0" :disabled="submitting"
                        @click="confirmImport()"
                        x-text="submitting ? '提交中…' : '✅ 确认并继续导入'"></button>
            </span>
            <button type="button" class="secondary" style="margin:0"
                    hx-post="/import/review/{{ task_id }}/cancel"
                    hx-confirm="确定取消本次导入？已上传的文件和识别结果将被删除。">
                ✖ 取消导入
            </button>
        </div>
    </div>
    <div id="review-result" style="margin-top:0.5rem">
        <p x-show="submitError" x-text="submitError" style="color:#c00"></p>
    </div>
</div>

<script>
document.addEventListener('alpine:init', () => {
    Alpine.data('ocrReview', () => ({
        mdContent: '',
        fileName: '',
        renderedHtml: '',
        searchQuery: '',
        replaceText: '',
        matches: [],
        currentMatchIdx: -1,
        hasMatches: false,
        matchInfo: '',
        submitting: false,
        submitError: '',

        async init() {
            try {
                // 从进度接口加载 OCR 内容
                const taskId = window.location.pathname.split('/').pop();
                const resp = await fetch(`/import/review/${taskId}/content`);
                const data = await resp.json();
                this.mdContent = data.content || '';
                this.fileName = data.file_name || '';
                this.updatePreview();
            } catch (e) {
                this.mdContent = '(加载失败)';
            }
        },

        updatePreview() {
            try {
                // 统一渲染：marked → DOMPurify → KaTeX（公式/表格），图片改写为 /import/review/{task_id}/imgs/
                this.renderedHtml = window.mdRender.renderHtml(this.mdContent || '', this._reviewBase());
            } catch (e) {
                this.renderedHtml = '<p style="color:red">渲染错误</p>';
            }
        },

        // 审查页 markdown 图片基路径（/import/review/{task_id}/）
        _reviewBase() {
            return '/import/review/' + window.location.pathname.split('/').pop() + '/';
        },

        // 搜索词 → 正则（转义元字符）。单一来源：匹配计数、预览高亮、全部替换共用，
        // 避免三处各写一份转义而口径漂移。
        _queryRegex(flags) {
            const escaped = (this.searchQuery || '').replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            return new RegExp(escaped, flags);
        },

        findMatches() {
            this.matches = [];
            this.currentMatchIdx = -1;
            this.clearHighlight();          // 先撤旧高亮（纯 DOM 操作，不重渲染）
            if (!this.searchQuery || !this.mdContent) {
                this.hasMatches = false;
                this.matchInfo = '';
                return;
            }
            const regex = this._queryRegex('gi');
            let m;
            while ((m = regex.exec(this.mdContent)) !== null) {
                this.matches.push({ index: m.index, length: m[0].length });
            }
            this.hasMatches = this.matches.length > 0;
            this.matchInfo = this.matches.length > 0
                ? `${this.matches.length} 个匹配`
                : '无匹配';
            this.highlightInPreview();
        },

        // 撤掉预览里的高亮：把 <mark> 换回文本节点并合并相邻文本节点
        clearHighlight() {
            const root = document.getElementById('review-preview');
            if (!root) return;
            for (const mark of root.querySelectorAll('mark.search-highlight')) {
                const parent = mark.parentNode;
                if (!parent) continue;
                parent.replaceChild(document.createTextNode(mark.textContent), mark);
                parent.normalize();   // 不合并的话反复搜索会攒下一堆碎片文本节点
            }
        },

        // 高亮必须在**已渲染的 DOM** 上做，绝不能改 Markdown 再重渲染。
        // 旧实现把整份 Markdown 做 HTML 转义、插 <mark>、再喂回渲染器：而 OCR 的表格
        // 是**原始 HTML**，那一刀转义会把 <table> 打回 &lt;table&gt; 字面文本 ——
        // 于是搜索框里每敲一个字符，预览里的表格就塌一次（实测复现）。
        // 附带收益：不再每敲一键整篇重渲染（CJJ 2-2008 有 46 万字符）。
        //
        // 只处理文本节点、不跨元素边界：跨 <strong> 或跨单元格的匹配不高亮，但
        // **匹配计数照旧按源码统计**（findMatches），两者互不影响。
        // 全部匹配统一高亮，不做"当前项"的精确对位——那需要维护一张
        // 「源码偏移 ↔ DOM 文本节点」映射表，收益不抵复杂度；上一个/下一个
        // 仍按源码偏移滚动编辑框，预览由已有的比例同步滚动带过去。
        highlightInPreview() {
            const root = document.getElementById('review-preview');
            if (!root || !this.searchQuery) return;
            const probe = this._queryRegex('i');    // 不带 g：test() 不会推进 lastIndex
            const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
            const hits = [];
            let node;
            while ((node = walker.nextNode())) {
                if (node.nodeValue && probe.test(node.nodeValue)) hits.push(node);
            }
            for (const textNode of hits) {
                const text = textNode.nodeValue;
                const rx = this._queryRegex('gi');
                const frag = document.createDocumentFragment();
                let last = 0;
                let m;
                // 按 exec 逐段切分，不用 split：split 只在正则**带捕获组**时才把命中片段
                // 一并返回，靠它区分"命中片段/间隔文本"会随正则写法静默错位（踩过）
                while ((m = rx.exec(text)) !== null) {
                    if (m[0] === '') { rx.lastIndex++; continue; }   // 防零宽匹配死循环
                    if (m.index > last) {
                        frag.appendChild(document.createTextNode(text.slice(last, m.index)));
                    }
                    const mark = document.createElement('mark');
                    mark.className = 'search-highlight';
                    mark.textContent = m[0];
                    frag.appendChild(mark);
                    last = m.index + m[0].length;
                }
                if (last < text.length) {
                    frag.appendChild(document.createTextNode(text.slice(last)));
                }
                textNode.parentNode.replaceChild(frag, textNode);
            }
        },

        prevMatch() {
            if (!this.hasMatches) return;
            this.currentMatchIdx = this.currentMatchIdx <= 0
                ? this.matches.length - 1
                : this.currentMatchIdx - 1;
            // 不再重复高亮：高亮对全部匹配一视同仁，重复调用会把已包好的 <mark> 再包一层
            this._scrollToMatch();
        },

        nextMatch() {
            if (!this.hasMatches) return;
            this.currentMatchIdx = this.currentMatchIdx >= this.matches.length - 1
                ? 0
                : this.currentMatchIdx + 1;
            this._scrollToMatch();
        },

        _scrollToMatch() {
            if (this.currentMatchIdx < 0 || this.currentMatchIdx >= this.matches.length) return;
            const match = this.matches[this.currentMatchIdx];
            const textarea = document.querySelector('.review-editor');
            if (!textarea) return;
            // 找到匹配位置在 textarea 中的行
            const before = this.mdContent.substring(0, match.index);
            const lineNum = before.split('\n').length - 1;
            const lineHeight = 20; // 近似
            textarea.scrollTop = lineNum * lineHeight - textarea.clientHeight / 2;
            textarea.setSelectionRange(match.index, match.index + match.length);
            textarea.focus();
            this.matchInfo = `${this.currentMatchIdx + 1}/${this.matches.length}`;
        },

        replaceCurrent() {
            if (!this.hasMatches || this.currentMatchIdx < 0) return;
            const match = this.matches[this.currentMatchIdx];
            this.mdContent =
                this.mdContent.substring(0, match.index) +
                this.replaceText +
                this.mdContent.substring(match.index + match.length);
            this.updatePreview();
            this.findMatches();
        },

        replaceAll() {
            if (!this.hasMatches) return;
            // 用**函数式**替换值：字符串替换值里的 `$&` / `$1` 会被 JS 当成替换模式
            // 展开（用户输入 "$&X" 会插进「甲X」这种意料之外的内容）
            this.mdContent = this.mdContent.replace(this._queryRegex('gi'), () => this.replaceText);
            this.updatePreview();
            this.findMatches();
        },

        async confirmImport() {
            // md 以 raw body（text/plain）提交，不走表单字段——表单字段有 1MB 上限，
            // 大规范（如 CJJ 2-2008 的 46 万字符）会被 400 拒掉且页面毫无反应。
            if (this.submitting) return;
            this.submitting = true;
            this.submitError = '';
            // 先把结果区滚到底，再发请求：进度/结果渲染在双栏**下方**，视口不够高时
            // 落在折叠线以下，会让人以为「点了没反应」而误判。
            // 必须**瞬时**：平滑滚动要到请求期间才到位，等于把误判窗口又留了出来
            // （与本仓「自动滚动改瞬时」的既定口径一致）。
            // 用「找最近的真正可滚动祖先」而不是 scrollIntoView：后者只把**元素底边**
            // 对齐视口底边，元素下方的容器内边距仍露不出来（实测差约 20px）。
            // 注意 window 不是滚动容器（.app-layout 为 100vh + overflow:hidden，
            // 审查页里滚动的是 .center-panel-v2），故不能直接 window.scrollTo。
            const resultBox = document.getElementById('review-result');
            for (let s = resultBox && resultBox.parentElement; s; s = s.parentElement) {
                if (s.scrollHeight > s.clientHeight) { s.scrollTop = s.scrollHeight; break; }
            }
            const taskId = window.location.pathname.split('/').pop();
            try {
                const resp = await fetch(`/import/review/${taskId}/confirm`, {
                    method: 'POST',
                    headers: {'Content-Type': 'text/plain; charset=utf-8'},
                    body: this.mdContent || '',
                });
                const html = await resp.text();
                const box = document.getElementById('review-result');
                if (box) box.innerHTML = html;
                if (!resp.ok) {
                    this.submitError = (html || '').replace(/<[^>]+>/g, '').trim()
                        || `提交失败（HTTP ${resp.status}）`;
                } else if (window.htmx && box) {
                    // 响应里的进度 div 带 hx-get/hx-trigger，需让 htmx 处理新节点才会开始轮询
                    window.htmx.process(box);
                }
            } catch (e) {
                this.submitError = '提交失败：' + e;
            } finally {
                this.submitting = false;
            }
        },

        syncScroll(event) {
            const preview = document.getElementById('review-preview');
            if (!preview) return;
            const ratio = event.target.scrollTop / (event.target.scrollHeight - event.target.clientHeight);
            preview.scrollTop = ratio * (preview.scrollHeight - preview.clientHeight);
        },
    }));
});
</script>
