<tr id="edit-{{ row.id }}" style="vertical-align:middle">
    <td colspan="7">
        <form style="margin:0;display:inline-flex;gap:0.3rem;align-items:center;flex-wrap:nowrap"
              hx-post="/termdict/{{ row.id }}/edit" hx-target="this" hx-swap="none"
              hx-on::after-request="if(event.detail.successful) document.body.dispatchEvent(new Event('termdictUpdated'))">
            <span style="font-size:0.85rem;white-space:nowrap;color:var(--pico-muted-color)">{{ row.label }}（权威标签不可改）</span>
            <input type="text" name="canonical" value="{{ row.canonical }}" required placeholder="代表词" style="width:110px;height:32px;margin:0;font-size:0.8rem">
            <input type="text" name="aliases" value="{{ row.aliases }}" placeholder="同义词面" style="width:150px;height:32px;margin:0;font-size:0.8rem">
            <input type="text" name="note" value="{{ row.note }}" placeholder="备注" style="width:100px;height:32px;margin:0;font-size:0.8rem">
            <button type="submit" class="secondary" style="height:32px;min-width:0;width:auto;padding:0 0.6rem;margin:0;font-size:0.78rem">保存</button>
            <button type="button" class="outline" style="height:32px;min-width:0;width:auto;padding:0 0.6rem;margin:0;font-size:0.78rem"
                    onclick="document.body.dispatchEvent(new Event('termdictUpdated'))">取消</button>
        </form>
    </td>
</tr>
