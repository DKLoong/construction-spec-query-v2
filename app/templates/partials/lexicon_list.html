{% if not rows %}
<p style="color:var(--pico-muted-color);font-size:0.85rem">当前类别暂无词条。</p>
{% else %}
<div style="overflow-x:auto">
<table style="font-size:0.85rem">
    <thead><tr>
        <th style="text-align:left">{{ columns[0] }}</th><th style="text-align:left">{{ columns[1] }}</th>
        {% if kind == 'confusable' %}<th style="text-align:left">{{ columns[2] }}</th>{% endif %}
        <th style="text-align:center">状态</th><th style="text-align:left">操作</th>
    </tr></thead>
    <tbody hx-target="closest tr" hx-swap="outerHTML">
    {% for row in rows %}{% include "partials/lexicon_row.html" %}{% endfor %}
    </tbody>
</table>
</div>
{% endif %}
