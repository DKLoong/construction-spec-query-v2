<!-- OCR 审查页（版面块 · P1 只读对照）
     左栏原文件（页图 + 高亮框） / 右栏版面块列表。
     编辑能力是 P2 的事；本期**只读**，无任何写路径。 -->
<!-- ⚠️ `@mouseup.window` 挂在**根**上（只注册一份）：拖拽可能在格**外**松开，
     mouseup 落到哪个元素上不确定 ⇒ 必须在 window 上收尾。若挂进 `x-for` 里会每块注册一份。 -->
<div x-data="reviewBlocks()" x-init="init()" class="rvb-root" @mouseup.window="onTableCellUp()"
     @keydown.escape.window="pickMode && togglePickMode()"
     x-effect="syncEditingUi()">

    <!-- 登录失效的出口（见 `review-blocks.js` 的 `_json`）。
         ⚠️ 必须单独成一条横幅：那时后端是 `302 → /login` 且 `fetch` 静默跟随 ⇒
         所有接口都返回 **HTTP 200 + 登录页 HTML**，若不识别，用户看到的就是
         `切分预览失败：SyntaxError: Unexpected token '<'…` —— 实测踩过。 -->
    <div class="rvb-session" x-show="sessionExpired" x-cloak>
        <p><strong>登录已过期</strong>，页面数据加载不出来了。
           请 <a href="/login">重新登录</a> 后再打开本页。</p>
    </div>

    <!-- 降级：没有 layout.json 时给出明确出口，而不是空白或崩溃（spec §13） -->
    <div class="rvb-error" x-show="error" x-cloak>
        <p x-text="error" style="color:#c00"></p>
        <p><a href="/">← 返回主界面</a></p>
    </div>

    <div class="rvb-panes" x-show="!error" x-cloak>
        <!-- ══ 左栏：原文件 ══ -->
        <section class="rvb-left">
            <!-- ⚠️ 视口必须是左栏**第一个**子元素：这样左栏顶部才与中栏（版面编辑）齐平。
                 缩放档与文件名先前压在视口上方，把左栏整体推下去、两栏顶不齐（用户实测）。
                 它们现在在视口**下方**的 `.rvb-foot` 行里 —— 见本元素末尾。 -->
            <!-- 页图加载失败：**最常见的原因是登录失效**（那时后端 302 到 /login，`<img>` 跟随
                 重定向后拿到的是 HTML ⇒ 破图）。不提示的话用户只会看到「没有 PDF、只剩压缩的
                 高亮框」，完全无从判断。⚠️ 必须是视口的**首个子元素 + 吸顶**：放进画布里会被
                 页面高度带跑（长页滚到下面就看不见了）。 -->
            <div class="rvb-img-err" x-show="pageImgErr" x-cloak>
                页图加载失败：<a href="/login">登录可能已过期，点此重新登录</a>
            </div>
            <div class="rvb-viewport" x-ref="vp" @mousedown="startPan($event)"
                 @contextmenu="confirmPick($event)">
                <div class="rvb-canvas" :class="pickMode && 'rvb-canvas--pick'"
                     :style="canvasStyle()" @mousedown="onPickDown($event)">
                    <img class="rvb-img" x-ref="pgimg" :src="pageUrl(curPage)"
                         @load="onImgLoad(); pageImgErr = false" @error="pageImgErr = true"
                         alt="原文件页图" draggable="false">
                    <!-- 高亮框：bbox 按百分比定位 ⇒ 缩放自动跟随（spec §6.3）
                         未定位的块（start_line 为空）不画框 -->
                    <template x-for="b in blocksOnPage()" :key="'hl' + b.__i">
                        <div class="rvb-box" x-show="hasSpan(b)"
                             :class="activeIdx === b.__i && 'rvb-box--on'"
                             :style="boxStyle(b)"
                             @click.stop="pickMode || focusBlock(b.__i)"></div>
                    </template>
                    <!-- 取图选框（P4 原型）：与 `pickRect` 同单位（画布内 CSS 像素）⇒ 像素定位。
                         手柄**只作视觉提示** —— 命中判定走 `imagePicker.hitHandle` 的坐标计算
                         ⇒ 整层 pointer-events:none，不参与事件（也就不会挡住画框的 mousedown）。 -->
                    <div class="rvb-sel" x-show="pickRect" x-cloak :style="selStyle()">
                        <template x-for="h in ['nw','n','ne','e','se','s','sw','w']" :key="h">
                            <span class="rvb-sel-h" :class="'rvb-sel-h--' + h"></span>
                        </template>
                    </div>
                </div>
            </div>

            <!-- 底部工具行（用户裁定：缩放档与文件名移到原文栏下方）
                 左 = 缩放 4 档 + 重置（spec §6.2；「重置」= 回适应宽度，**不是刷新**）
                 右 = 页码 + 文件名（`margin-left:auto` 右对齐，文件名过长省略不换行） -->
            <div class="rvb-foot">
                <div class="rvb-zoom">
                    <button type="button" class="outline" @click="setScaleMode('fit')"
                            :class="scaleMode === 'fit' && 'rvb-on'">适应宽度</button>
                    <button type="button" class="outline" @click="setScaleMode(1.0)"
                            :class="scaleMode === 1 && 'rvb-on'">100%</button>
                    <button type="button" class="outline" @click="setScaleMode(1.5)"
                            :class="scaleMode === 1.5 && 'rvb-on'">150%</button>
                    <button type="button" class="outline" @click="setScaleMode(2.0)"
                            :class="scaleMode === 2 && 'rvb-on'">200%</button>
                    <button type="button" class="secondary outline" @click="resetZoom()"
                            title="缩放恢复「适应宽度」">重置</button>
                </div>
                <!-- 拖框取图（P4 原型）：**显式模式**。与「拖动查看」共用同一个 mousedown，
                     进模式后 startPan 让位（见 review-blocks.js 的 startPan 首行）。 -->
                <button type="button" class="outline rvb-pick" @click="togglePickMode()"
                        x-text="pickMode ? '退出取图' : '取图'"
                        :class="pickMode && 'rvb-on'"
                        title="在页图上拖出矩形取图：可拖动 / 拉角调节，右键单击确认"></button>
                <span class="rvb-pick-msg" x-show="pickMsg" x-cloak x-text="pickMsg"></span>
                <span class="rvb-foot-right">
                    <span class="rvb-pageinfo" x-text="curPage + ' / ' + pages.length"></span>
                    <span class="rvb-file" x-text="fileName || '原文件'"></span>
                </span>
            </div>
        </section>

        <!-- ══ 右栏：版面块列表 ══ -->
        <section class="rvb-right">
            <div class="rvb-blocks" x-ref="list">
                <template x-for="(b, i) in blocks" :key="'bk' + i">
                    <!-- ⚠️ 本块**不写**任何读 `editingIdx`/`activeIdx`/`tableError` 的绑定：
                         那三样是**页面级**状态，而 Alpine 是「谁读过、变量一变谁就重算」⇒
                         4000 块 × 每块 ~7 个这样的绑定 = 改一次跑 2.8 万遍（实测进编辑 857ms）。
                         现在由根元素上**唯一一个** `x-effect="syncEditingUi()"` 命令式地只改
                         「当前块」的 class，显隐交给 `.rvb-block--editing` 的 CSS。 -->
                    <article class="rvb-block" :data-block-idx="i" @click="focusBlock(i)">
                        <header class="rvb-block-hd">
                            <span class="rvb-tag" x-text="labelZh(b.label)"></span>
                            <!-- 条文号：无归属则不标（spec §11.2） -->
                            <span class="rvb-clause" x-show="b.clause_no" x-text="b.clause_no"></span>
                            <!-- ⚠️ 未定位必须**明说**（静默隐藏会让人以为这块不存在） -->
                            <span class="rvb-unlocated" x-show="!hasSpan(b)"
                                  title="该块在 markdown 中的表示与原文件不同，无法定位到页上区域">原文件未定位</span>
                            <span class="rvb-page" x-text="'p' + b.page"></span>
                        </header>
                        <!-- 只读态：编辑入口只在**可编辑块**上出现（spec §8.1 的「纠正」） -->
                        <div class="rvb-block-bd" x-html="renderBlock(b)"></div>
                        <div class="rvb-block-meta">
                            <!-- 图片块走 `canEditImage`（不在文本白名单里，但有 span 就能回写） -->
                            <button type="button" class="outline rvb-fix"
                                    x-show="canEdit(b) || canEditImage(b)"
                                    @click.stop="enterEdit(i)">纠正</button>
                            <span class="rvb-edited" x-show="isEdited(b)">已修改</span>
                            <!-- 不可编辑必须**明说原因**，不得静默隐藏（Global Constraint 6） -->
                            <span class="rvb-locked" x-show="!canEdit(b) && !canEditImage(b)"
                                  x-text="hasSpan(b) ? '该块类型暂不支持编辑' : '原文件未定位，无法安全回写'"></span>
                        </div>
                        <!-- 编辑态：行级编辑器（行 = contenteditable） -->
                        <div class="rvb-editor">
                            <div class="rvb-tools">
                                <!-- ⚠️ **行编辑专属**控件另包一层并带 `label !== 'table'` 门控：表格块的
                                     `.rvb-lines` 是空的，这些控件对它是死的（「+ 行」/「- 行」会把 null
                                     传进 `_insertLineAfter`/`_deleteLine`）。
                                     ⚠️ **不能门控整个 `.rvb-tools`**：「取消」/「保存」也在这一排，
                                     且是表格编辑态**唯一**的保存出口（Task 4 的表格工具条只有结构操作
                                     按钮、不含保存）—— 整排门控会让表格**无法保存**。
                                     包一层 `inline-flex` 容器保持与原先相同的排布（gap 同为 0.3rem）。 -->
                                <!-- 行编辑专属控件：表格块与**图片块**都不适用（图片块里没有"行"，
                                     点「+ 行」会把 null 传进 `_insertLineAfter`）。 -->
                                <span class="rvb-line-tools"
                                      x-show="blocks[i].label !== 'table'
                                              && !imageLabels.includes(blocks[i].label)">
                                    <!-- ⚠️ `@mousedown.prevent` 不是可选项：点按钮会让 contenteditable **失焦**、
                                         选区塌掉，execCommand 就作用不到任何东西（点了 B 没反应）。
                                         prevent 掉 mousedown ⇒ 焦点与选区都留在当前行。 -->
                                    <button type="button" title="粗体" @mousedown.prevent @click="exec('bold')"
                                            style="margin:0"><strong>B</strong></button>
                                    <!-- 斜体按钮用**衬线**斜体 I：等宽无衬线的大写 I 做倾斜变换后
                                         就是一根斜杠（用户把它读成了「/」）—— 衬线斜体 I 才认得出是 I。 -->
                                    <button type="button" title="斜体" @mousedown.prevent @click="exec('italic')"
                                            style="margin:0"><span class="rvb-btn-i">I</span></button>
                                    <button type="button" title="删除线" @mousedown.prevent @click="exec('strikeThrough')"
                                            style="margin:0"><s>S</s></button>
                                    <span class="rvb-sep"></span>
                                    <!-- 对齐作用于**当前行**（用户裁定）；编号行禁用并说明原因。
                                         禁用元素不弹 tooltip ⇒ title 走**双通道**：外层 span 给可见提示，
                                         按钮自身给程序化读取（探针断言的就是它）—— 本仓既有口径。 -->
                                    <span :title="alignDisabled() ? ALIGN_LOCK_HINT : ''">
                                        <button type="button" :title="alignDisabled() ? ALIGN_LOCK_HINT : '左对齐'"
                                                @mousedown.prevent @click="applyAlign(null)"
                                                :disabled="alignDisabled()" style="margin:0">左</button>
                                        <button type="button" :title="alignDisabled() ? ALIGN_LOCK_HINT : '居中'"
                                                @mousedown.prevent @click="applyAlign('center')"
                                                :disabled="alignDisabled()" style="margin:0">中</button>
                                        <button type="button" :title="alignDisabled() ? ALIGN_LOCK_HINT : '右对齐'"
                                                @mousedown.prevent @click="applyAlign('right')"
                                                :disabled="alignDisabled()" style="margin:0">右</button>
                                    </span>
                                    <span class="rvb-sep"></span>
                                    <button type="button" @mousedown.prevent @click="_insertLineAfter(_focusLine())"
                                            style="margin:0">+ 行</button>
                                    <button type="button" @mousedown.prevent @click="_deleteLine(_focusLine())"
                                            style="margin:0">- 行</button>
                                </span>
                                <!-- 「取消」/「保存」对**所有** label 都可见（表格编辑态唯一保存出口） -->
                                <button type="button" @click="cancelEdit()" style="margin:0">取消</button>
                                <button type="button" @click="saveEdit()" style="margin:0">保存</button>
                            </div>
                            <!-- 表格工具条（独立一排，仅表格块编辑态可见）。按钮尺寸与行编辑器一致：
                                 `.rvb-tools button` 已是 0.72rem / padding 1px 6px，故复用该类。
                                 ⚠️ **与上面那排「并存」是预期的**（不是缺陷）：上面那排此时只剩
                                 `取消/保存`（行编辑专属控件由 `.rvb-line-tools` 的 `label !== 'table'`
                                 门控隐藏），而 `取消/保存` 是表格编辑态**唯一**的保存出口 —— 本排只有
                                 结构操作按钮、**不含保存**。不要把整排 `.rvb-tools` 门控掉，否则表格
                                 将无法保存（Task 3 修正轮实测踩过：f14_6/f14_7 保存点击 30s 超时）。 -->
                            <!-- ⚠️ **表格专属部件整组按块类型渲染**（`x-if`，不是 `x-show`）：
                                 4000 块里只有 ~24 块是表格，而这一组（16 按钮 + 5 分隔 + 提示 + 表格宿主
                                 + 块内报错）约 **30 个节点/块** ⇒ 用 `x-show` 等于白带 ~12 万节点
                                 （实测：编辑器外壳占总 DOM 的 67%、每块约 48 个节点）。
                                 `x-if` 的条件读 `b.label` —— **页面生命周期内不变**，该 effect 只在初始化时
                                 跑一次，**不会**重新引入"读全局态 ⇒ 每次交互跑 N 遍"那类问题。
                                 ⚠️ 外层包一个 `.rvb-tbl-wrap` 是必需的：`template x-if` 只接受**单个**根元素。 -->
                            <template x-if="b.label === 'table'">
                            <div class="rvb-tbl-wrap">
                            <div class="rvb-tools">
                                <button type="button" @click="tableOp('insertRowBefore')" style="margin:0"
                                        title="在选中格所在行之前插入一行">+ 行</button>
                                <button type="button" @click="tableOp('insertRowAfter')" style="margin:0"
                                        title="在选中格所在行之后插入一行">行 +</button>
                                <button type="button" @click="tableOp('insertColBefore')" style="margin:0"
                                        title="在选中格所在列之前插入一列">+ 列</button>
                                <button type="button" @click="tableOp('insertColAfter')" style="margin:0"
                                        title="在选中格所在列之后插入一列">列 +</button>
                                <span class="rvb-sep"></span>
                                <button type="button" @click="tableOp('deleteRow')" style="margin:0"
                                        title="删除选中格所在的整行">- 行</button>
                                <button type="button" @click="tableOp('deleteCol')" style="margin:0"
                                        title="删除选中格所在的整列">- 列</button>
                                <!-- ⚠️ 插入锚点**写死**在「- 列」之后：本工具条里 `.rvb-sep` 有多处
                                     （行编辑器那排 + 本排前面一枚），按 `.rvb-sep` 定位会插错位置。 -->
                                <span class="rvb-sep"></span>
                                <button type="button" @click="tableOp('merge')" style="margin:0"
                                        title="合并选中的单元格">合并</button>
                                <button type="button" @click="tableOp('split')" style="margin:0"
                                        title="拆分选中的单元格">拆分</button>
                                <button type="button" @click="tableUndo()" style="margin:0"
                                        title="撤销上一次表格结构操作">撤销</button>
                                <span class="rvb-sep"></span>
                                <button type="button" title="粗体" @mousedown.prevent @click="tableExec('bold')"
                                        style="margin:0"><strong>B</strong></button>
                                <button type="button" title="斜体" @mousedown.prevent @click="tableExec('italic')"
                                        style="margin:0"><span class="rvb-btn-i">I</span></button>
                                <button type="button" title="删除线" @mousedown.prevent @click="tableExec('strikeThrough')"
                                        style="margin:0"><s>S</s></button>
                                <span class="rvb-sep"></span>
                                <button type="button" @click="tableAlign(null)" style="margin:0" title="格内文字左对齐">左</button>
                                <button type="button" @click="tableAlign('center')" style="margin:0" title="格内文字居中">中</button>
                                <button type="button" @click="tableAlign('right')" style="margin:0" title="格内文字右对齐">右</button>
                                <span class="rvb-sep"></span>
                                <button type="button" @click="tableRemoveImages()" style="margin:0"
                                        title="删除选中格里的图片（不删文件）">删图</button>
                            </div>
                            <!-- 选区手势的**可发现性**提示（用户实测：只有 Shift+点 能用、界面又没提示
                                 ⇒ 「选不中多格 ⇒ 合并点不动」）。这段文案就是操作说明，别再删。
                                 ⚠️ **必须独占一行**，不能塞进上面那排 —— `.rvb-tools` 是
                                 `flex-wrap: nowrap; overflow-x: auto`，塞进去会溢出并把按钮**压扁成竖排**
                                 （实测截图：`+行` 变两行、「合并」拆成两个字上下排）。 -->
                            <div class="rvb-hint">
                                多选：<kbd>Shift</kbd>+单击，或按住左键拖拽
                            </div>
                            <!-- 表格编辑器容器：仅当该块 label === 'table' 时由 JS 填充。
                                 与行编辑器的 `.rvb-lines` 分开，避免 `.rvb-line` 选择器互相干扰。 -->
                            <div class="rvb-table-edit"
                                 @click="onTableCellClick($event)"
                                 @mousedown="onTableCellDown($event)"
                                 @mouseover="onTableCellOver($event)"></div>
                            <!-- 表格编辑态的**块内**错误提示（spec §2.4：校验失败要保留编辑态、
                                 只在块内报错）。**不要**复用页面级的 `submitError` —— 那个横幅
                                 在提交条下方（已落到折线以下），用户当下看不到。 -->
                            <p class="rvb-table-err" style="color:#c00;margin:0.25rem 0 0"></p>
                            </div><!-- /.rvb-tbl-wrap -->
                            </template>
                            <!-- 图片块编辑态（P4）：宿主里放**整行 md HTML**（对齐包裹、width/alt
                                 都在里面），src 由 JS 绝对化 —— 页 URL 无尾斜杠，相对 `imgs/…`
                                 会解析到 `/import/review/imgs/…` ⇒ 编辑态必破图。
                                 与表格同理用 `x-if` 而非 `x-show`：图块只占少数，`x-show` 会白带节点。 -->
                            <template x-if="imageLabels.includes(b.label)">
                            <div class="rvb-img-wrap">
                                <div class="rvb-tools">
                                    <!-- 三个入口汇到同一落点（`_imgApplyBlob` → `_uploadImage`）：
                                         点击选文件 / 拖拽文件到下方 / 粘贴（截图、复制的位图）。 -->
                                    <input type="file" accept="image/*" style="display:none"
                                           @change="imgReplaceFromFile($event)">
                                    <button type="button" @click="imgChooseFile($event)" style="margin:0"
                                            title="从本机选一张图替换（也可直接把文件拖到下方，或粘贴截图）">选文件</button>
                                    <button type="button" @click="imgDelete()" style="margin:0"
                                            title="只解除本块的图片引用，原文件保留；点「取消」可撤回">删除图片</button>
                                </div>
                                <p class="rvb-img-err" x-show="imgError" x-cloak x-text="imgError"
                                   style="color:#c00;margin:0.25rem 0 0"></p>
                                <!-- `tabindex` 是**粘贴入口**的前提：不加则宿主不可聚焦、收不到 paste -->
                                <div class="rvb-img-edit" tabindex="0"
                                     @dragover.prevent @drop.prevent="imgReplaceFromDrop($event)"
                                     @paste="imgReplaceFromPaste($event)"></div>
                            </div>
                            </template>
                            <!-- ⚠️ 不给 `x-ref`：编辑框在 x-for 内，同名 x-ref 会被最后一项
                                 覆盖 ⇒ 组件里的 `_editBox()` 按 data-block-idx 作用域查 -->
                            <div class="rvb-lines"></div>
                        </div>
                    </article>
                </template>
            </div>
        </section>

        <!-- 切分预览（spec §11.4）：**独立第三栏**。此前嵌在右栏下部（220px 横条），
             把编辑区挤扁、割裂左中对照；改为与左右栏等高的独立栏。
             header 里的计数与新增/消失标记、列表的 :key 均保持不变。 -->
        <section class="rvb-cut" x-show="!error" x-cloak
                 :style="cutOpen ? '' : 'flex:0 0 44px'">
            <header class="rvb-cut-hd">
                <strong x-show="cutOpen">切分预览</strong>
                <span x-show="cutOpen" x-text="'当前 ' + preview.count + ' 条'"></span>
                <span class="rvb-added" x-show="cutOpen && preview.added.length"
                      x-text="'新增 ' + preview.added.length + ' 条'"></span>
                <span class="rvb-removed" x-show="cutOpen && preview.removed.length"
                      x-text="'消失 ' + preview.removed.length + ' 条'"></span>
                <span x-show="cutOpen && previewBusy" style="color:var(--pico-muted-color)">计算中…</span>
                <span x-show="cutOpen" x-text="previewErr" style="color:#c00"></span>
                <!-- 折叠按钮放在 header **末尾**并右推，形状/尺寸照抄 QA 会话管理栏的
                     `#qa-session-toggle`（箭头指向「面板将要移动的方向」）。
                     ⚠️ 折叠后（44px 宽）只留这一个按钮：其余文案一律 `x-show="cutOpen"`，
                     否则窄栏里 header 会横向溢出（终审记过的 Minor）。 -->
                <button type="button" class="outline rvb-cut-toggle"
                        @click="cutOpen = !cutOpen"
                        x-text="cutOpen ? '切分 ▸' : '◂'"
                        title="展开/折叠切分预览"></button>
            </header>
            <ol class="rvb-clause-list" x-show="cutOpen">
                <!-- key 用**下标**：clause_no 可能重复（后端会产出空串），
                     用它做 key 会让 Alpine 在列表变更时崩成「只剩标题行」（Task 2） -->
                <template x-for="(c, ci) in preview.clauses" :key="'pc' + ci">
                    <li :class="[preview.added.includes(c.clause_no) && 'rvb-clause-new',
                                  isClauseActive(c.clause_no) && 'rvb-clause-on']"
                        @click="openClause(c.clause_no)">
                        <span class="rvb-cn" x-text="c.clause_no"></span>
                        <span x-text="c.title"></span>
                    </li>
                </template>
            </ol>
        </section>
    </div>

    <!-- 提交 / 取消（与源码审查页同构：raw body + 结果区 + htmx 轮询） -->
    <div class="rvb-submit">
        <small style="color:var(--pico-muted-color)">审查完毕后点击确认继续导入流程（解析 + 分类 + 索引）</small>
        <!-- 两个按钮**成组右对齐**（用户裁定）：主操作在左、取消在右。
             注意**不要**写成 `justify-content: space-between`——那会让「确认」落在页面
             中部、看着像跟中栏（版面编辑栏）绑在一起。 -->
        <span class="rvb-submit-actions">
            <span style="position:relative;display:inline-flex;align-items:center">
                <span x-show="submitting" x-cloak class="rvb-mask"></span>
                <button type="button" style="position:relative;z-index:1;margin:0" :disabled="submitting"
                        @click="confirmImport()" x-text="submitting ? '提交中…' : '✅ 确认并继续导入'"></button>
            </span>
            <button type="button" class="secondary" style="margin:0"
                    hx-post="/import/review/{{ task_id }}/cancel"
                    hx-confirm="确定取消本次导入？已上传的文件和识别结果将被删除。">✖ 取消导入</button>
        </span>
    </div>
    <!-- ⚠️ `submitError` 的 `<p>` 必须在 `#rvb-result` **外面**（Task 9 评审的 Important 发现）：
         报错路径上 `box.innerHTML = html` 会把槽内内容**整体换掉** ⇒ 槽内的 `<p>` 被销毁 ⇒
         随后 `this.submitError = …`（服务端报错与 catch 里的网络错**两路都算**）**永远看不见**，
         而且**第一次提交之后这条通道就永久失效**（`<p>` 再也不会回来）。
         既有源码审查页 `ocr_review.html` 是**同一种形状**（本计划当初正是照抄它）⇒ 一并修，
         见 Step 1 末尾的附带修复。 -->
    <div id="rvb-result" class="rvb-result-slot"></div>
    <p x-show="submitError" x-text="submitError" style="color:#c00"></p>

    <!-- 取图预览（原型：**只预览**，不落盘、不插入）。
         挂在 `.rvb-root` 下而不是 `.rvb-viewport` 里 —— 视口是 `overflow:auto`，
         浮层放进去会被裁掉。 -->
    <div class="rvb-pick-pop" x-show="pickPreview" x-cloak>
        <div class="rvb-pick-pop-hd">
            <span x-text="'取图预览 · 第 ' + curPage + ' 页'"></span>
            <button type="button" class="secondary outline" @click="pickPreview = ''">关闭</button>
        </div>
        <!-- ⚠️ 必须 `x-if`（按需存在），不能只靠外层 `x-show`（只切 display）：
             `pickPreview` 为空串时 `<img :src="">` 会把**页面 URL** 当成图去请求 ⇒
             `@error` 随即把「取图预览加载失败」写进 `pickMsg` —— 用户一进页面就看到
             一条红字，以为坏了（实测截图抓到；隐藏元素上的 DOM 断言发现不了它）。
             `x-if` 之后这张 `<img>` 只在真有预览时才存在，`@error` 也只剩真失败会触发。 -->
        <template x-if="pickPreview">
            <img :src="pickPreview" alt="取图预览"
                 @error="pickPreview = ''; pickMsg = '取图预览加载失败'">
        </template>
        <p class="rvb-pick-pop-tip">原型阶段：只预览，未落盘、未插入单元格</p>
    </div>
</div>
