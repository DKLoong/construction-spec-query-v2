<!-- 全局设置弹窗 -->
<div x-data="settingsDialog"
     x-show="open"
     @keydown.escape.window="if(open) close()"
     @click.self="close()"
     class="qa-modal-overlay"
     style="display:none"
     x-cloak>
    <div class="qa-modal-box" style="max-width:520px">
        <div class="qa-modal-header">
            <span>⚙️ 系统设置</span>
            <button class="qa-modal-close" @click="close()" aria-label="关闭">&times;</button>
            
        </div>
        <div class="qa-modal-body">
            <!-- 标签页 -->
            <div style="display:flex;gap:0;margin-bottom:1rem;border-bottom:2px solid var(--pico-muted-border-color)">
                <button @click="activeTab='ocr'"
                        :style="{borderBottom: activeTab==='ocr' ? '2px solid var(--pico-primary-background)' : '2px solid transparent', fontWeight: activeTab==='ocr' ? 'bold' : 'normal'}"
                        style="flex:1;padding:0.5rem;border:none;background:none;cursor:pointer;margin-bottom:-2px;font-size:0.85rem;color:#2c3e50">
                    📷 OCR 识别
                </button>
                <button @click="activeTab='ai'"
                        :style="{borderBottom: activeTab==='ai' ? '2px solid var(--pico-primary-background)' : '2px solid transparent', fontWeight: activeTab==='ai' ? 'bold' : 'normal'}"
                        style="flex:1;padding:0.5rem;border:none;background:none;cursor:pointer;margin-bottom:-2px;font-size:0.85rem;color:#2c3e50">
                    🤖 AI 问答及分类
                </button>
            </div>

            <!-- OCR 标签页 -->
            <div x-show.important="activeTab==='ocr'">
                <!-- OCR 后端选择 -->
                <label style="font-size:0.85rem;margin-bottom:0.5rem">选择 OCR 后端</label>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:0.3rem;margin-bottom:0.75rem">
                    <label style="font-size:0.8rem;padding:0.3rem;border:1px solid var(--pico-muted-border-color);border-radius:4px;cursor:pointer"
                           :style="{background: ocrBackend==='paddle-vl' ? 'var(--pico-primary-background)' : '', color: ocrBackend==='paddle-vl' ? 'var(--pico-primary-inverse)' : ''}">
                        <input type="radio" x-model="ocrBackend" value="paddle-vl" style="display:none"> PaddleOCR-VL (推荐)
                    </label>
                    <label style="font-size:0.8rem;padding:0.3rem;border:1px solid var(--pico-muted-border-color);border-radius:4px;cursor:pointer"
                           :style="{background: ocrBackend==='accurate-basic' ? 'var(--pico-primary-background)' : '', color: ocrBackend==='accurate-basic' ? 'var(--pico-primary-inverse)' : ''}">
                        <input type="radio" x-model="ocrBackend" value="accurate-basic" style="display:none"> accurate_basic (旧版)
                    </label>
                    <label style="font-size:0.8rem;padding:0.3rem;border:1px solid var(--pico-muted-border-color);border-radius:4px;cursor:pointer"
                           :style="{background: ocrBackend==='custom' ? 'var(--pico-primary-background)' : '', color: ocrBackend==='custom' ? 'var(--pico-primary-inverse)' : ''}">
                        <input type="radio" x-model="ocrBackend" value="custom" style="display:none"> 自定义
                    </label>
                </div>

                <!-- 后端描述 -->
                <small style="color:var(--pico-muted-color);display:block;margin-bottom:0.5rem">
                    <span x-show="ocrBackend==='paddle-vl'">📄 文档解析引擎，输出结构化 Markdown（保留表格/标题/公式/图表），异步处理</span>
                    <span x-show="ocrBackend==='accurate-basic'">📝 通用文字识别，纯文本输出，无格式保留，同步处理</span>
                    <span x-show="ocrBackend==='custom'">🔧 使用自定义 OCR 端点，支持 OpenAI Vision 兼容 API</span>
                </small>

                <!-- Access Token -->
                <label style="font-size:0.85rem">
                    <span x-show="ocrBackend==='custom'">API Key / Access Token</span>
                    <span x-show="ocrBackend!=='custom'">百度 AI Studio Access Token</span>
                    <input type="password" x-model="currentOCRToken"
                           placeholder="输入 access_token..."
                           style="font-family:monospace;font-size:0.8rem">
                </label>

                <!-- PaddleOCR-VL 高级选项 -->
                <div x-show="ocrBackend==='paddle-vl'" style="margin-top:0.5rem;font-size:0.8rem">
                    <p style="margin:0.25rem 0;font-weight:bold">高级选项</p>
                    <label style="display:flex;align-items:center;gap:0.3rem;cursor:pointer;margin:0.15rem 0">
                        <input type="checkbox" x-model="ocrPaddleVLParams.analysis_chart"> 识别统计图表
                    </label>
                    <label style="display:flex;align-items:center;gap:0.3rem;cursor:pointer;margin:0.15rem 0">
                        <input type="checkbox" x-model="ocrPaddleVLParams.merge_tables"> 合并跨页表格
                    </label>
                    <label style="display:flex;align-items:center;gap:0.3rem;cursor:pointer;margin:0.15rem 0">
                        <input type="checkbox" x-model="ocrPaddleVLParams.relevel_titles"> 段落标题层级识别
                    </label>
                    <label style="display:flex;align-items:center;gap:0.3rem;cursor:pointer;margin:0.15rem 0">
                        <input type="checkbox" x-model="ocrPaddleVLParams.recognize_seal"> 印章识别
                    </label>
                </div>

                </div>
