<!-- 日志管理面板（Tab 3）：筛选 + 导出异常 + 手动清理 + 列表 -->
<style>
.log-filters { display:flex; gap:0.75rem; flex-wrap:wrap; align-items:flex-end; margin-top:0.5rem; }
.log-ctl { display:inline-flex; flex-direction:column; gap:0.2rem; font-size:0.75rem; color:var(--pico-muted-color); }
.log-ctl > input[type=text], .log-ctl > select, .log-ctl > input[type=date] {
    margin:0; height:2.1rem; width:auto; min-width:0;
}
.log-ctl input[name=user] { width:6.5rem; }
.log-actions { display:inline-flex; gap:0.5rem; align-items:center; height:2.1rem; }
.log-actions button { height:2.1rem; line-height:1.2; }
.range-box {
    display:inline-flex; align-items:center; gap:0.15rem;
    border:1px solid var(--pico-muted-border-color, #c0c0c0);
    border-radius:4px; padding:0.05rem 0.25rem; height:2.1rem; box-sizing:border-box;
}
.range-box input[type=date] {
    margin:0; border:none; box-shadow:none; background:transparent;
    padding:0.15rem 0.1rem; width:7.4rem; height:auto; font-size:0.8rem;
}
.range-box .sep { color:var(--pico-muted-color); padding:0 0.1rem; }
</style>

<div x-data="logsManager()">
    <details>
        <summary>🔍 筛选条件</summary>
        <div class="log-filters">
            <label class="log-ctl">类别
                <select x-model="category">
                    <option value="">全部</option>
                    {% for c, label in [('import','导入'),('spec','规范'),('rule','规则'),('classify','分类'),('review','复核'),('maintenance','维护'),('auth','登录'),('system','系统')] %}
                    <option value="{{ c }}">{{ label }}</option>
                    {% endfor %}
                </select>
            </label>
            <label class="log-ctl">级别
                <select x-model="level">
                    <option value="">全部</option>
                    <option value="INFO">INFO</option>
                    <option value="WARN">WARN</option>
                    <option value="ERROR">ERROR</option>
                    <option value="ERROR,WARN">⚠️ 异常</option>
                </select>
            </label>
            <label class="log-ctl">操作者
                <select x-model="user">
                    <option value="">全部</option>
                    <template x-for="o in operators" :key="o">
                        <option :value="o" x-text="o"></option>
                    </template>
                </select>
            </label>
            <label class="log-ctl">日期
                <span class="range-box">
                    <input x-model="start" type="date" title="开始日期">
                    <span class="sep">~</span>
                    <input x-model="end" type="date" title="结束日期">
                </span>
            </label>
            <label class="log-ctl">关键词
                <input x-model="keyword" type="text" placeholder="动作/详情/用户">
            </label>
            <div class="log-actions">
                <button class="outline" @click="applyFilter()">筛选</button>
                <button class="outline" @click="resetFilter()">重置</button>
                <a :href="exportUrl()"><button class="outline">📤 导出异常日志</button></a>
            </div>
        </div>
    </details>

    <details>
        <summary>🧹 手动清理</summary>
        <form style="display:flex;gap:0.5rem;flex-wrap:wrap;align-items:center;margin-top:0.5rem" onsubmit="return false">
            <label><input type="radio" name="scope" value="older" checked> 90 天前</label>
            <label><input type="radio" name="scope" value="all"> 全部</label>
            <label><input type="radio" name="scope" value="category"> 指定分类</label>
            <select name="category" style="width:auto">
                {% for c, label in [('import','导入'),('spec','规范'),('rule','规则'),('classify','分类'),('review','复核'),('maintenance','维护'),('auth','登录'),('system','系统')] %}
                <option value="{{ c }}">{{ label }}</option>
                {% endfor %}
            </select>
            <button class="outline" style="font-size:0.8rem"
                hx-post="/maintenance/logs/clean" hx-include="closest form"
                hx-target="#clean-result" hx-swap="innerHTML"
                hx-confirm="确定执行日志清理？该操作不可恢复。"
                hx-on::after-request="document.body.dispatchEvent(new CustomEvent('logsRefresh'))">执行清理</button>
        </form>
        <div id="clean-result" style="margin-top:0.5rem"></div>
    </details>

    <div id="logs-list" hx-get="/maintenance/logs" hx-trigger="load, logsRefresh from:body" hx-swap="innerHTML">
        <p style="color:var(--pico-muted-color);padding:0.5rem 0">加载中…</p>
    </div>
</div>
<script>
// 日志筛选状态与请求（内联组件，与 rules_list 一致的 fetch 约定）。操作者候选项
// 从 /maintenance/logs/operators 拉取填充下拉；日期范围为两个 date 的紧凑组合。
function logsManager() {
    return {
        category: '', level: '', user: '', start: '', end: '', keyword: '',
        operators: [],
        init() { this.loadOperators(); },
        async loadOperators() {
            try {
                const resp = await fetch('/maintenance/logs/operators');
                this.operators = await resp.json();
            } catch (e) { this.operators = []; }
        },
        params() {
            const p = new URLSearchParams();
            if (this.category) p.set('category', this.category);
            if (this.level) p.set('level', this.level);
            if (this.user) p.set('user', this.user);
            if (this.start) p.set('start', this.start);
            if (this.end) p.set('end', this.end);
            if (this.keyword) p.set('keyword', this.keyword.trim());
            return p;
        },
        applyFilter() {
            if (window.htmx) htmx.ajax('GET', '/maintenance/logs?' + this.params().toString(),
                { target: '#logs-list', swap: 'innerHTML' });
        },
        resetFilter() {
            this.category = ''; this.level = ''; this.user = ''; this.start = '';
            this.end = ''; this.keyword = '';
            this.applyFilter();
        },
        exportUrl() {
            const p = this.params();
            if (!p.get('level')) p.set('level', 'ERROR,WARN'); // 未指定级别默认导出异常
            return '/maintenance/logs/export?' + p.toString();
        }
    };
}
</script>
