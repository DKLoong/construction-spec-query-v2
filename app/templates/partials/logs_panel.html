<!-- 日志管理面板（Tab 3）：筛选 + 导出异常 + 手动清理 + 列表 -->
<style>
/* 只做基线对齐，不改控件原生高度 */
.log-filters { display:flex; gap:1rem; flex-wrap:wrap; align-items:flex-end; margin-top:0.6rem; }
.log-ctl { display:inline-flex; flex-direction:column; gap:0.25rem; font-size:0.75rem; color:var(--pico-muted-color); margin:0; }
.log-ctl select { width:auto; margin:0; }
.log-ctl input[type=text] { width:calc(8.5rem + 35px); margin:0; }
.log-ctl input[type=date] { width:calc(8.2rem + 35px); margin:0; }
.log-actions { display:inline-flex; gap:0.5rem; align-items:flex-end; }
.log-actions button { margin:0; }
</style>

<div x-data="logsManager()">
    <details>
        <summary>🔍 筛选条件</summary>
        <div class="log-filters">
            <label class="log-ctl">类别
                <select x-model="category">
                    <option value="">全部</option>
                    {% for c, label in [('import','导入'),('spec','规范'),('rule','规则'),('classify','分类'),('review','复核'),('maintenance','维护'),('auth','登录'),('system','系统')] %}
                    <option value="{{ c }}">{{ label }}</option>
                    {% endfor %}
                </select>
            </label>
            <label class="log-ctl">级别
                <select x-model="level">
                    <option value="">全部</option>
                    <option value="INFO">INFO</option>
                    <option value="WARN">WARN</option>
                    <option value="ERROR">ERROR</option>
                    <option value="ERROR,WARN">⚠️ 异常</option>
                </select>
            </label>
            <label class="log-ctl">操作者
                <select x-model="user">
                    <option value="">全部</option>
                    <template x-for="o in operators" :key="o">
                        <option :value="o" x-text="o"></option>
                    </template>
                </select>
            </label>
            <label class="log-ctl">日期范围
                <span style="display:inline-flex;align-items:center;gap:0.35rem">
                    <input x-model="start" type="date" title="开始日期">
                    <span style="color:var(--pico-muted-color)">~</span>
                    <input x-model="end" type="date" title="结束日期">
                </span>
            </label>
            <label class="log-ctl">关键词
                <input x-model="keyword" type="text" placeholder="动作/详情/用户">
            </label>
            <div class="log-actions">
                <button class="outline" @click="applyFilter()">筛选</button>
                <button class="outline" @click="resetFilter()">重置</button>
                <a :href="exportUrl()"><button class="outline">📤 导出异常日志</button></a>
            </div>
        </div>
    </details>

    <details>
        <summary>🧹 手动清理</summary>
        <form style="display:flex;flex-wrap:wrap;align-items:flex-end;gap:1rem;margin-top:0.6rem" onsubmit="return false">
            <label style="display:inline-flex;align-items:center;gap:0.3rem;margin:0"><input type="radio" name="scope" value="older" checked> 90 天前</label>
            <label style="display:inline-flex;align-items:center;gap:0.3rem;margin:0"><input type="radio" name="scope" value="all"> 全部</label>
            <label style="display:inline-flex;align-items:center;gap:0.3rem;margin:0"><input type="radio" name="scope" value="category"> 指定分类</label>
            <span style="display:inline-flex;align-items:flex-end;gap:0.5rem">
                <select name="category" style="width:auto;margin:0">
                    {% for c, label in [('import','导入'),('spec','规范'),('rule','规则'),('classify','分类'),('review','复核'),('maintenance','维护'),('auth','登录'),('system','系统')] %}
                    <option value="{{ c }}">{{ label }}</option>
                    {% endfor %}
                </select>
                <button class="outline" style="margin:0"
                    hx-post="/maintenance/logs/clean" hx-include="closest form"
                    hx-target="#clean-result" hx-swap="innerHTML"
                    hx-confirm="确定执行日志清理？该操作不可恢复。"
                    hx-on::after-request="document.body.dispatchEvent(new CustomEvent('logsRefresh'))">执行清理</button>
            </span>
        </form>
        <div id="clean-result" style="margin-top:0.5rem"></div>
    </details>

    <!-- 回顶挂在常驻容器（非分页链接，链接随 innerHTML 替换失效；对照搜索 result_list.html 约定） -->
    <div id="logs-list" hx-get="/maintenance/logs" hx-trigger="load, logsRefresh from:body"
         hx-swap="innerHTML"
         hx-on::after-settle="document.querySelector('.center-panel-v2').scrollTop = 0">
        <p style="color:var(--pico-muted-color);padding:0.5rem 0">加载中…</p>
    </div>
</div>
<script>
// 日志筛选状态与请求（内联组件，与 rules_list 一致的 fetch 约定）。操作者候选项
// 从 /maintenance/logs/operators 拉取填充下拉；日期范围为两个原生 date 的紧凑组合。
function logsManager() {
    return {
        category: '', level: '', user: '', start: '', end: '', keyword: '',
        operators: [],
        init() { this.loadOperators(); },
        async loadOperators() {
            try {
                const resp = await fetch('/maintenance/logs/operators');
                this.operators = await resp.json();
            } catch (e) { this.operators = []; }
        },
        params() {
            const p = new URLSearchParams();
            if (this.category) p.set('category', this.category);
            if (this.level) p.set('level', this.level);
            if (this.user) p.set('user', this.user);
            if (this.start) p.set('start', this.start);
            if (this.end) p.set('end', this.end);
            if (this.keyword) p.set('keyword', this.keyword.trim());
            return p;
        },
        applyFilter() {
            if (window.htmx) htmx.ajax('GET', '/maintenance/logs?' + this.params().toString(),
                { target: '#logs-list', swap: 'innerHTML' });
        },
        resetFilter() {
            this.category = ''; this.level = ''; this.user = ''; this.start = '';
            this.end = ''; this.keyword = '';
            this.applyFilter();
        },
        exportUrl() {
            const p = this.params();
            if (!p.get('level')) p.set('level', 'ERROR,WARN'); // 未指定级别默认导出异常
            return '/maintenance/logs/export?' + p.toString();
        }
    };
}
</script>
