<!-- 左栏：分类树 + 搜索 + 导入 -->
<div x-data="treeView()" class="left-panel-content">
    <!-- 搜索框 -->
    <div class="search-box" x-data="searchBox()">
        <input type="search" x-model="keyword" @keyup.enter="search()"
               placeholder="输入关键词搜索条文...">
        <!-- 勾选立即重搜：放行前言/条文说明等打标非条文（后端 include_non_clause=1） -->
        <label style="display:flex;align-items:center;gap:0.4rem;margin-top:0.3rem;line-height:1">
            <input type="checkbox" x-model="includeNonClause" @change="search()"
                   style="width:0.875rem;height:0.875rem;flex:none;margin:0;padding:0">
            <span style="font-size:0.8rem;line-height:0.875rem;white-space:nowrap">包含前言·条文说明</span>
        </label>
        <!-- CE 精排热切换：勾选/取消立即重搜（onCeChange 弹提示 + 触发重搜），结果实时按新开关排序 -->
        <label style="display:flex;align-items:center;gap:0.4rem;margin-top:0.3rem;line-height:1">
            <input type="checkbox" x-model="ceRerank" @change="onCeChange()"
                   style="width:0.875rem;height:0.875rem;flex:none;margin:0;padding:0">
            <span style="font-size:0.8rem;line-height:0.875rem;white-space:nowrap">启用 CE 精排</span>
        </label>
        <!-- 仅现行/修订中：状态过滤热切换；全不勾选 → 不过滤 + 4s 顶部轻提示 -->
        <label style="display:flex;align-items:center;gap:0.4rem;margin-top:0.3rem;line-height:1">
            <input type="checkbox" x-model="statusCurrent" @change="onStatusChange()"
                   style="width:0.875rem;height:0.875rem;flex:none;margin:0;padding:0">
            <span style="font-size:0.8rem;line-height:0.875rem;white-space:nowrap">仅现行</span>
        </label>
        <label style="display:flex;align-items:center;gap:0.4rem;margin-top:0.3rem;line-height:1">
            <input type="checkbox" x-model="statusRevising" @change="onStatusChange()"
                   style="width:0.875rem;height:0.875rem;flex:none;margin:0;padding:0">
            <span style="font-size:0.8rem;line-height:0.875rem;white-space:nowrap">修订中</span>
        </label>
    </div>

    <!-- 导入按钮 -->
    <div style="margin-bottom: 0.5rem;" x-data="importDialog()">
        <button class="contrast" style="width: 100%;" @click="openDialog()">📥 导入规范</button>
        <!-- 导入对话框 -->
        <div class="dialog-overlay" x-show="open" x-cloak @click.self="closeDialog()">
            <div class="dialog-box">
                <h3>导入规范文件</h3>
                <form @submit.prevent="handleUpload">
                    <label>规范编号 <input type="text" name="code" placeholder="如 GB 50204-2015"
                                           x-model="codeInput" @input="markManual('code')"></label>
                    <label>规范名称 <input type="text" name="title" placeholder="如 混凝土结构工程施工质量验收规范"
                                           x-model="titleInput" @input="markManual('title')"></label>
                    <button type="button" class="outline" style="width:100%;margin-top:0.3rem"
                            @click="runVersionCheck()" :disabled="checking">
                        <span x-text="checking ? '校核中...' : '🔍 校核有效性'"></span>
                    </button>
                    <template x-if="checkResult"><div id="version-check-result" style="margin-top:0.5rem">
                        <div style="display:flex;align-items:center;gap:0.4rem;flex-wrap:wrap">
                            <span style="font-size:0.8rem">状态：</span>
                            <select x-model="checkResult.status" style="font-size:0.8rem;padding:0.15rem 0.3rem;width:auto">
                                <option value="现行">现行</option>
                                <option value="修订中">修订中</option>
                                <option value="废止">废止</option>
                            </select>
                            <small x-show="!checkResult.ai_available" style="color:var(--pico-del-color, #c44);font-size:0.75rem">⚠️ AI 校验不可用，请手动确认状态</small>
                        </div>
                        <template x-if="checkResult.corrected && (checkResult.corrected.code !== codeInput || checkResult.corrected.title !== titleInput)">
                            <div style="margin-top:0.3rem;font-size:0.8rem">
                                <small>AI 建议：<code x-text="checkResult.corrected.code"></code> <span x-text="checkResult.corrected.title"></span></small>
                                <button type="button" class="outline" style="font-size:0.75rem;padding:0.1rem 0.4rem" @click="applySuggestion()">应用</button>
                                <button type="button" class="secondary" style="font-size:0.75rem;padding:0.1rem 0.4rem" @click="checkResult.corrected = null">忽略</button>
                            </div>
                        </template>
                        <label style="margin-top:0.4rem;font-size:0.8rem">
                            被替代编号
                            <input type="text" x-model="checkResult.replacedBy" placeholder="如 GB 50010-2011（可留空）"
                                   style="font-size:0.8rem;padding:0.2rem 0.4rem">
                        </label>
                    </div></template>
                    <small x-show="contentEdited && checkResult" style="color:var(--pico-muted-color);font-size:0.75rem">
                        内容已修改，建议重新校核
                    </small>
                    <label>选择文件 <input type="file" name="file" accept=".md,.pdf"
                                           @change="autoFillFromFilename($event)"
                                           title="选择文件后将自动识别规范编号与名称"></label>
                    <label style="display:flex;align-items:center;gap:0.4rem;margin-top:0.3rem">
                        <input type="checkbox" name="force_ocr" value="true">
                        <span style="font-size:0.8rem">强制 OCR（扫描件/格式丢失的 PDF 勾选此项）</span>
                    </label>
                    <div style="margin-top: 1rem;">
                        <button type="submit" :disabled="uploading">开始导入</button>
                        <button type="button" class="secondary" @click="closeDialog()">取消</button>
                    </div>
                </form>
                <div style="text-align:right;margin-top:0.3rem">
                    <a href="#" @click.prevent="$dispatch('open-settings', {tab:'ocr'})"
                       style="font-size:0.75rem;color:var(--pico-muted-color)">⚙️ API 设置</a>
                </div>
                <div id="import-result"></div>
            </div>
        </div>
    </div>

    <!-- 功能按钮 — 两行两列 -->
    <div style="margin-bottom: 0.5rem; display: grid; grid-template-columns: 1fr 1fr; gap: 0.3rem;">
        <a href="/specs" style="text-decoration:none">
            <button class="outline" style="width:100%;font-size:0.8rem">📚 规范</button>
        </a>
        <a href="/rules" style="text-decoration:none">
            <button class="outline" style="width:100%;font-size:0.8rem">📋 规则</button>
        </a>
        <a href="/review" style="text-decoration:none;display:block">
            <button class="outline" style="width:100%;font-size:0.8rem;position:relative">📝 审核
                <span id="review-pending-badge" style="display:none;position:absolute;top:50%;right:4px;transform:translateY(-50%);min-width:16px;height:16px;border-radius:50%;background:#d93025;color:#fff;font-size:10px;line-height:16px;text-align:center;padding:0 3px;box-sizing:border-box;font-weight:600"
                      title="有待审核项"></span>
            </button>
        </a>
        <a href="/lexicon" style="text-decoration:none">
            <button class="outline" style="width:100%;font-size:0.8rem">📖 词库</button>
        </a>
        <a href="/maintenance" style="text-decoration:none">
            <button class="outline" style="width:100%;font-size:0.8rem">🛠 维护</button>
        </a>
        <!-- QA 页是整页导航（与 📚规范 / 📋规则 / 📖词库 同形）。
             href 由 buildQaUrl() 在点击时按当前筛选拼出，使 QA 页继承检索条件 -->
        <button type="button" class="outline" style="width:100%;font-size:0.8rem"
                onclick="window.location.href = buildQaUrl()">
            🤖 AI问答
        </button>
    </div>

    <!-- 分类树 -->
    <div class="tree-container">
        <template x-for="dim in dimensions" :key="dim.key">
            <details>
                <summary x-text="dim.label"></summary>
                <template x-for="node in dim.nodes" :key="node.value">
                    <div class="tree-node">
                        <span class="tree-label"
                              :class="{ active: (Array.isArray(activeFilters[dim.key]) ? activeFilters[dim.key].includes(node.value) : activeFilters[dim.key] === node.value) }"
                              @click="selectFilter(dim.key, node.value)">
                            <span x-text="node.label"></span>
                            <span class="tree-count" x-text="'(' + node.count + ')'"></span>
                        </span>
                        <template x-for="child in node.children" :key="child.value">
                            <div class="tree-node">
                                <span class="tree-label"
                                      :class="{ active: (Array.isArray(activeFilters[dim.key]) ? activeFilters[dim.key].includes(child.value) : activeFilters[dim.key] === child.value) }"
                                      @click="selectFilter(dim.key, child.value)">
                                    <span x-text="child.label"></span>
                                    <span class="tree-count" x-text="'(' + child.count + ')'"></span>
                                </span>
                            </div>
                        </template>
                    </div>
                </template>
            </details>
        </template>
    </div>
    <script>
    /* 审核宫格红点：有待审核项（条文待审+词面校核）时点亮，计数省略 99+ */
    (function () {
        var badge = document.getElementById('review-pending-badge');
        if (!badge) return;
        var pending = false;
        function refresh() {
            fetch('/review/pending-count', { headers: { 'Accept': 'application/json' } })
                .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
                .then(function (d) {
                    var n = (d.clause || 0) + (d.word || 0);
                    pending = n > 0;
                    if (pending) {
                        badge.style.display = 'inline-block';
                        badge.textContent = n > 99 ? '99+' : String(n);
                        badge.title = '条文待审 ' + (d.clause || 0) + ' · 词面校核 ' + (d.word || 0);
                    } else {
                        badge.style.display = 'none';
                    }
                })
                .catch(function () { /* 忽略瞬时错误，下次轮询重试 */ });
        }
        refresh();
        ['reviewClausePending', 'reviewWordPending', 'reviewBlacklist'].forEach(function (ev) {
            document.addEventListener(ev, refresh);
        });
        setInterval(refresh, 30000);
    })();
    </script>
</div>
