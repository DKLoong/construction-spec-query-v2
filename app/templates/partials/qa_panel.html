<!-- AI 问答面板（弹窗内用） -->
<div x-data="qaView()" class="qa-panel-content">
    <!-- 问答模式切换：RAG 综合问答（默认） / 原文摘抄 -->
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.35rem">
        <label style="display:flex;align-items:center;gap:0.25rem;font-size:0.75rem;margin:0;cursor:pointer">
            <input type="checkbox" :checked="mode==='verbatim'" @change="toggleMode()" style="width:1rem;height:1rem">
            原文摘抄模式（禁止归纳，仅摘抄标注来源）
        </label>
        <small x-text="mode==='verbatim' ? '🔤 原文摘抄' : '📖 综合问答'" style="color:var(--pico-muted-color)"></small>
    </div>
    <div class="qa-messages" x-ref="msgBox" style="min-height: 50vh; max-height: 55vh; overflow-y: auto; padding: 0.5rem; border: 1px solid var(--pico-muted-border-color); border-radius: 6px; margin-bottom: 0.5rem; background: var(--pico-card-background-color)">
        <template x-for="(msg, i) in messages" :key="i">
            <div class="qa-msg" :class="msg.role === 'user' ? 'qa-user' : 'qa-bot'">
                <template x-if="msg.role === 'bot'">
                    <div x-html="renderMarkdown(msg.content, msg.sources)"></div>
                </template>
                <template x-if="msg.role === 'user'">
                    <div x-text="msg.content"></div>
                </template>
            </div>
        </template>
    </div>
    <div style="display:flex;gap:0.25rem">
        <textarea x-model="input" @keydown.enter.prevent="send()" placeholder="输入问题并按 Enter 发送..."
                  style="flex:1;font-size:0.85rem" rows="3"></textarea>
        <div style="display:flex;flex-direction:column;gap:0.25rem">
            <button @click="send()" :disabled="loading || !input.trim()"
                    style="font-size:0.75rem;padding:0.25rem 0.5rem;white-space:nowrap">发送</button>
            <button @click="clearChat()" class="outline"
                    style="font-size:0.75rem;padding:0.25rem 0.5rem;white-space:nowrap">清空</button>
        </div>
    </div>
</div>
