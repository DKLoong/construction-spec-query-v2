<!-- 中栏：规则列表 -->
<style>
/* 数值字段的悬浮说明与越界提示（对齐运维「参数设置」模块的观感） */
.rule-field { position:relative; }
.rule-pop { position:absolute; top:calc(100% + 4px); left:0; right:0; z-index:50;
    background:#fffdf8; border:1px solid #ddd0bd; border-radius:6px;
    box-shadow:0 4px 14px rgba(74,68,84,.14); padding:0.4rem 0.5rem;
    font-size:0.72rem; color:#5a4a33; line-height:1.35; }
.rule-err { color:#d32f2f; font-size:0.72rem; display:block; margin-top:0.15rem; }
/* 子字段下拉的键盘高亮项（与鼠标 hover 同为 sf-active） */
.sf-item { padding:0.3rem 0.5rem; cursor:pointer; }
.sf-item.sf-active { background:var(--pico-primary-focus); }
.field-hint { font-size:0.72rem; color:var(--pico-muted-color); }

/* ── 行内操作按钮的垂直居中 ──
   Pico 按钮自带 margin-bottom(var(--pico-spacing)≈14.4px)：在 flex 行内会把按钮顶偏，
   并撑高所在单元格，使其与相邻列文字不垂直居中（本仓同类修复的既有先例）。
   两个视图共用 .row-actions，一次清零。 */
.row-actions { display:flex; gap:0.25rem; align-items:center; }
.row-actions button { margin:0; }
/* 控制行（筛选 + 视图切换）也必须清零按钮下边距：
   Pico 只给带显式 type 属性的 <button> 加 margin-bottom:var(--pico-spacing)（14.4px），
   而筛选键无 type、视图键是 type="button" → 视图列被撑高 14.4px，行内 align-items:center
   转而把矮的筛选列居中，结果视图键比筛选键偏上 7.2px（实测 top 92.16 vs 84.97）。
   清零后三者 top 全等。（只比 height 发现不了：两键高度本就都是 44.19px。） */
.rules-controls button { margin:0; }
/* #rules-table 是两种视图片段的共同容器，故一条规则同时覆盖平铺表与分组表 */
#rules-table td { vertical-align:middle; }

/* ── 分组视图（rules_grouped.html）样式放这里而非片段内 ──
   片段经 innerHTML 反复装载，内联 <style> 会随每次切换视图重复注入、不断累积。 */
.rule-group { border:1px solid var(--pico-muted-border-color,#ddd); border-radius:6px;
    margin-bottom:0.6rem; overflow:hidden; }
/* 组头 = section band：深底 + 近白字（只改字不改底反而更看不见）。
   取值一律走 Pico 变量而非硬编码 hex：本项目 pico.custom.css 的颜色变量实际被 Pico
   自身的更高优先级主题块压掉（见 TODOS T10），写死 hex 会与运行时不一致。 */
.rule-group-head { display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap;
    padding:0.45rem 0.6rem; cursor:pointer;
    background:var(--pico-contrast-background); color:var(--pico-primary-inverse); }
.rule-group-head .caret { font-size:0.8rem; color:var(--pico-primary-inverse); }
.rule-group-head .meta { font-size:0.72rem; color:var(--pico-primary-inverse); opacity:0.85; }
.rule-group-head button { margin:0; }
.rule-group-body { padding:0.4rem 0.6rem; }
.rule-group-body table { font-size:0.85rem; margin:0; }
</style>
<div x-data="rulesManager()" style="padding:1rem">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
        <h2 style="margin:0">📋 分类规则管理</h2>
        <button @click="window.dispatchEvent(new CustomEvent('open-settings', {detail: {tab: 'ai'}}))" class="outline secondary" style="font-size:0.75rem;padding:0.2rem 0.5rem">⚙️ 设置</button>
    </div>

    <!-- 控制行：左列＝六维筛选（自身可换行），右列＝视图切换（独立不换行 → 右缘对齐设置键右缘）
         视图键与筛选键同构（都 outline + contrast 选中态、都不覆盖字号）→ 天然等高、文字同基线。
         视图组必须独立成列并 flex-shrink:0：若与筛选键同处一个 flex-wrap 行，
         宽度不足时会把「按标签」单独挤到第二行（实测发生）。 -->
    <div class="rules-controls" style="margin-bottom:1rem;display:flex;align-items:center;gap:0.75rem">
        <div style="display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap;flex:1;min-width:0">
            <button class="outline" :class="{ contrast: filterDim === '' }"
                    @click="filterDim = ''; loadRules()">全部</button>
            <template x-for="d in dimensions" :key="d.key">
                <button class="outline" :class="{ contrast: filterDim === d.key }"
                        @click="filterDim = d.key; loadRules()" x-text="d.label"></button>
            </template>
        </div>
        <div style="display:flex;align-items:center;gap:0.5rem;flex-shrink:0">
            <button type="button" class="outline" :class="{ contrast: viewMode === 'rules' }"
                    :aria-pressed="viewMode === 'rules' ? 'true' : 'false'"
                    @click="setView('rules')">📋 按规则</button>
            <button type="button" class="outline" :class="{ contrast: viewMode === 'label' }"
                    :aria-pressed="viewMode === 'label' ? 'true' : 'false'"
                    @click="setView('label')">🏷 按标签</button>
        </div>
    </div>

    <!-- 规则质量报表（实时：三类异常 + 一键处理） -->
    <div id="rules-quality-wrap"
         hx-get="/rules/quality" hx-trigger="load, rulesQualityRefresh from:body" hx-swap="innerHTML">
    </div>

    <!-- 操作按钮行 -->
    <div style="margin-bottom:1rem;display:flex;align-items:center;gap:0.5rem;flex-wrap:wrap">
        <button @click="openCreate()" class="secondary">➕ 新建规则</button>
        <button hx-post="/classify/run" hx-target="#classify-result" class="secondary"
                style="background:var(--pico-primary-background);border-color:var(--pico-primary-background);color:white">
            🤖 运行 AI 分类
        </button>
        <!-- 待处理统计（#3b）：行数=条文×维度项；load + 每次运行AI后经 classifyStatsRefresh 刷新 -->
        <span id="classify-pending" style="line-height:1"
              hx-get="/classify/pending-stats" hx-trigger="load, classifyStatsRefresh from:body"
              hx-swap="innerHTML" aria-live="polite"></span>
    </div>
    <div id="classify-result"></div>

    <!-- 新建规则弹窗 -->
    <div class="dialog-overlay" x-show="showForm" @click.self="showForm = false" x-cloak>
        <div class="dialog-box">
            <h3>新建分类规则</h3>
            <form @submit.prevent="createRule">
                <label>维度 <select x-model="newRule.dimension" required>
                    <option value="">-- 选择维度 --</option>
                    <template x-for="d in dimensions" :key="d.key">
                        <option :value="d.key" x-text="d.label"></option>
                    </template>
                </select></label>
                <label>子字段 <small class="field-hint">（信息性，不参与匹配，可留空）</small>
                    <div style="position:relative">
                        <input type="text" x-model="newRule.sub_field" placeholder="如 specialty"
                               @input="fetchSubFields('new')"
                               @focus="openSubField('new')"
                               @blur="hideSubFieldDropdown()"
                               @keydown.arrow-down="onSubFieldArrow($event, 1)"
                               @keydown.arrow-up="onSubFieldArrow($event, -1)"
                               @keydown.enter="onSubFieldEnter($event)"
                               @keydown.escape="subFieldOpen = false">
                        <ul x-show="subFieldSuggestions.length > 0 && subFieldOpen"
                            x-transition
                            @mousedown.prevent
                            style="position:absolute;top:100%;left:0;right:0;background:var(--pico-form-element-background-color);border:1px solid var(--pico-form-element-border-color);border-radius:0 0 4px 4px;max-height:150px;overflow-y:auto;z-index:100;list-style:none;padding:0;margin:0">
                            <template x-for="(s, i) in subFieldSuggestions" :key="s">
                                <li class="sf-item" :class="subFieldIndex === i ? 'sf-active' : ''"
                                    @click="pickSubField(s)"
                                    @mouseover="subFieldIndex = i"
                                    x-text="s"></li>
                            </template>
                        </ul>
                    </div>
                </label>
                <label>关键词 <small class="field-hint">（用规范术语；避免过泛短词）</small>
                    <div class="rule-field">
                        <input type="text" x-model="newRule.pattern" required
                               placeholder="如 混凝土"
                               @focus="focusField('new.pattern')"
                               @blur="blurField('new.pattern')">
                        <div class="rule-pop" x-show="showHelp('new.pattern')"
                             x-text="helpFor('new.pattern')"></div>
                    </div>
                </label>
                <label>标签 <small style="color:var(--pico-muted-color)">（可空；填了则命中后把该标签写入分类列，同一标签可配多个关键词）</small>
                    <input type="text" x-model="newRule.label" placeholder="留空 = 关键词本身就是标签">
                </label>
                <label>匹配方式
                    <select x-model="newRule.match_type">
                        <option value="keyword">关键词 (keyword)</option>
                        <option value="regex">正则 (regex)</option>
                    </select>
                </label>
                <label>优先级 (0-10)
                    <div class="rule-field">
                        <input type="number" x-model="newRule.priority" min="0" max="10"
                               @focus="focusField('new.priority')"
                               @blur="blurField('new.priority')"
                               :aria-invalid="invalid('new.priority')">
                        <div class="rule-pop" x-show="showHelp('new.priority')"
                             x-text="helpFor('new.priority')"></div>
                    </div>
                    <small class="rule-err" x-show="fieldErrs['new.priority']">您输入的参数超出可调范围，请重新输入</small>
                </label>
                <label>阈值 (0-1)
                    <div class="rule-field">
                        <input type="number" x-model="newRule.threshold" min="0" max="1" step="0.1"
                               @focus="focusField('new.threshold')"
                               @blur="blurField('new.threshold')"
                               :aria-invalid="invalid('new.threshold')">
                        <div class="rule-pop" x-show="showHelp('new.threshold')"
                             x-text="helpFor('new.threshold')"></div>
                    </div>
                    <small class="rule-err" x-show="fieldErrs['new.threshold']">您输入的参数超出可调范围，请重新输入</small>
                </label>
                <div style="margin-top:1rem;display:flex;gap:0.5rem">
                    <button type="submit">✅ 创建</button>
                    <button type="button" class="secondary" @click="showForm = false">取消</button>
                </div>
            </form>
            <div id="create-result"></div>
        </div>
    </div>

    <!-- 编辑规则弹窗 -->
    <div class="dialog-overlay" x-show="showEditForm" @click.self="showEditForm = false" x-cloak>
        <div class="dialog-box">
            <h3>编辑分类规则</h3>
            <form @submit.prevent="updateRule">
                <input type="hidden" x-model="editRule.id">
                <label>维度 <select x-model="editRule.dimension" required>
                    <option value="">-- 选择维度 --</option>
                    <template x-for="d in dimensions" :key="d.key">
                        <option :value="d.key" x-text="d.label"></option>
                    </template>
                </select></label>
                <label>子字段 <small class="field-hint">（信息性，不参与匹配，可留空）</small>
                    <div style="position:relative">
                        <input type="text" x-model="editRule.sub_field" placeholder="如 specialty"
                               @input="fetchSubFields('edit')"
                               @focus="openSubField('edit')"
                               @blur="hideSubFieldDropdown()"
                               @keydown.arrow-down="onSubFieldArrow($event, 1)"
                               @keydown.arrow-up="onSubFieldArrow($event, -1)"
                               @keydown.enter="onSubFieldEnter($event)"
                               @keydown.escape="subFieldOpen = false">
                        <ul x-show="subFieldSuggestions.length > 0 && subFieldOpen"
                            x-transition
                            @mousedown.prevent
                            style="position:absolute;top:100%;left:0;right:0;background:var(--pico-form-element-background-color);border:1px solid var(--pico-form-element-border-color);border-radius:0 0 4px 4px;max-height:150px;overflow-y:auto;z-index:100;list-style:none;padding:0;margin:0">
                            <template x-for="(s, i) in subFieldSuggestions" :key="s">
                                <li class="sf-item" :class="subFieldIndex === i ? 'sf-active' : ''"
                                    @click="pickSubField(s)"
                                    @mouseover="subFieldIndex = i"
                                    x-text="s"></li>
                            </template>
                        </ul>
                    </div>
                </label>
                <label>关键词 <small class="field-hint">（用规范术语；避免过泛短词）</small>
                    <div class="rule-field">
                        <input type="text" x-model="editRule.pattern" required
                               placeholder="如 混凝土"
                               @focus="focusField('edit.pattern')"
                               @blur="blurField('edit.pattern')">
                        <div class="rule-pop" x-show="showHelp('edit.pattern')"
                             x-text="helpFor('edit.pattern')"></div>
                    </div>
                </label>
                <label>标签 <small style="color:var(--pico-muted-color)">（可空；填了则命中后把该标签写入分类列，同一标签可配多个关键词）</small>
                    <input type="text" x-model="editRule.label" placeholder="留空 = 关键词本身就是标签">
                </label>
                <label>匹配方式
                    <select x-model="editRule.match_type">
                        <option value="keyword">关键词 (keyword)</option>
                        <option value="regex">正则 (regex)</option>
                    </select>
                </label>
                <label>优先级 (0-10)
                    <div class="rule-field">
                        <input type="number" x-model="editRule.priority" min="0" max="10"
                               @focus="focusField('edit.priority')"
                               @blur="blurField('edit.priority')"
                               :aria-invalid="invalid('edit.priority')">
                        <div class="rule-pop" x-show="showHelp('edit.priority')"
                             x-text="helpFor('edit.priority')"></div>
                    </div>
                    <small class="rule-err" x-show="fieldErrs['edit.priority']">您输入的参数超出可调范围，请重新输入</small>
                </label>
                <label>阈值 (0-1)
                    <div class="rule-field">
                        <input type="number" x-model="editRule.threshold" min="0" max="1" step="0.1"
                               @focus="focusField('edit.threshold')"
                               @blur="blurField('edit.threshold')"
                               :aria-invalid="invalid('edit.threshold')">
                        <div class="rule-pop" x-show="showHelp('edit.threshold')"
                             x-text="helpFor('edit.threshold')"></div>
                    </div>
                    <small class="rule-err" x-show="fieldErrs['edit.threshold']">您输入的参数超出可调范围，请重新输入</small>
                </label>
                <div style="margin-top:1rem;display:flex;gap:0.5rem">
                    <button type="submit">💾 保存</button>
                    <button type="button" class="secondary" @click="showEditForm = false">取消</button>
                </div>
            </form>
            <div id="edit-result"></div>
        </div>
    </div>

    <!-- 规则列表：加载统一走 JS loadRules()（按 viewMode 选端点）。
         不再挂 htmx 加载——否则 htmx 那条路径会绕过视图模式、恒取平铺列表。 -->
    <div id="rules-table">
        <p aria-busy="true">加载中...</p>
    </div>
</div>

<script>
document.addEventListener('alpine:init', () => {
    Alpine.data('rulesManager', () => ({
        filterDim: '',
        viewMode: 'rules',   // 'rules' = 平铺（按规则）| 'label' = 分组（按标签）
        showForm: false,
        showEditForm: false,
        stats: [],
        subFieldSuggestions: [],
        subFieldOpen: false,
        subFieldTimer: null,
        subFieldTarget: 'new',    // 下拉归属表单：'new' | 'edit'（两弹窗共用一套候选态）
        subFieldIndex: -1,        // 键盘高亮项下标；-1 = 未选
        // 数值字段的悬浮说明与可调范围（对齐运维「参数设置」模块的交互）
        activeHelp: '',
        fieldErrs: {},
        helpText: {
            priority: '优先级越高，该规则与其他规则竞争同一维度时的得分加成越大（每级 +10%）。它只影响同维竞争的排序，不改变是否命中。可调范围 0~10。',
            threshold: '规则自身的匹配门槛：条文匹配得分低于此值时不参与该维度竞争，也就不会被采纳为该维标签。可调范围 0~1，越大越严格（越不易打标）。',
            pattern: '词面按「出现次数」计分，不判词边界，所以：① 务必用规范术语——条文会先被词库归一化（俗称→规范词），而 pattern 本身不归一化，写俗称将永不命中；② 避免过泛短词——「钢筋」会命中「预应力钢筋」，「接头」会命中「接头百分率」，短泛词容易虚高得分；③ 同一标签配多个关键词＝建多条规则共享同一标签（逗号分隔不生效）。',
        },
        ranges: { priority: {min: 0, max: 10}, threshold: {min: 0, max: 1} },
        editRule: {id:'', dimension:'', sub_field:'', pattern:'', match_type:'keyword', priority:0, threshold:0.6},
        dimensions: [
            // dim1（规范属性）由编号前缀硬编码管理，规则引擎不参与，故不纳入规则管理
            {key: 'dim2', label: '工程阶段'},
            {key: 'dim3', label: '工程类型'},
            {key: 'dim4', label: '所属专业'},
            {key: 'dim5', label: '工程部位'},
            {key: 'dim6', label: '材料/工艺'},
        ],
        newRule: {dimension:'', sub_field:'', pattern:'', match_type:'keyword', priority:0, threshold:0.6, label:''},

        dimLabel(key) {
            const d = this.dimensions.find(d => d.key === key);
            return d ? d.label : key;
        },

        init() {
            this.loadRules();
            // 质量报表批量动作等仍以 body 事件请求刷新列表（原 htmx 触发点改由这里接管）
            document.body.addEventListener('rulesListRefresh', () => this.loadRules());
        },

        setView(mode) {
            if (this.viewMode === mode) return;
            this.viewMode = mode;
            this.loadRules();
        },

        loadRules() {
            const base = this.viewMode === 'label' ? '/rules/grouped' : '/rules/list';
            const url = this.filterDim ? `${base}?dimension=${this.filterDim}` : base;
            fetch(url).then(r => r.text()).then(html => {
                const el = document.getElementById('rules-table');
                el.innerHTML = html;
                if (window.htmx) htmx.process(el);  // 平铺片段内含 htmx 属性，需重新绑定
            });
        },

        // 分组视图的行内操作：操作后整体重载 + 刷新质量报表。
        // 不复用平铺行的 htmx 局部替换——分组视图里没有对应的 <tr> 可换。
        refreshAfterAction() {
            this.loadRules();
            document.body.dispatchEvent(new CustomEvent('rulesQualityRefresh'));
        },
        async toggleRule(id) {
            await fetch(`/rules/${id}/toggle`, {method: 'POST'});
            this.refreshAfterAction();
        },
        async lockRule(id) {
            await fetch(`/rules/${id}/lock`, {method: 'POST'});
            this.refreshAfterAction();
        },
        async deleteRule(id, pattern) {
            if (!confirm(`确定删除规则「${pattern}」？`)) return;
            await fetch(`/rules/${id}`, {method: 'DELETE'});
            this.refreshAfterAction();
        },
        // 组头「+ 添加关键词」：预填该组的维度与标签后打开新建弹窗
        openCreateFor(dimension, label) {
            this.fieldErrs = {}; this.activeHelp = '';
            this.newRule = {
                dimension: dimension, sub_field: '', pattern: '', match_type: 'keyword',
                priority: 0, threshold: 0.6, label: label || '',
            };
            this.showForm = true;
        },

        // ── 数值字段：悬浮说明 + 失焦范围校验（对齐运维「参数设置」模块）──
        fieldOf(k) { return k.split('.')[1]; },
        helpFor(k) { return this.helpText[this.fieldOf(k)]; },
        showHelp(k) { return this.activeHelp === k && !this.fieldErrs[k]; },
        // aria-invalid=true 由 Pico 原生渲染红边框 + 无效图标
        invalid(k) { return this.fieldErrs[k] ? 'true' : null; },
        focusField(k) { this.activeHelp = k; },
        blurField(k) { this.activeHelp = ''; this.validateField(k); },
        validateField(k) {
            const field = this.fieldOf(k);
            const range = this.ranges[field];
            if (!range) { this.fieldErrs[k] = false; return; }  // 非数值字段（如 pattern）不做范围校验
            const form = k.startsWith('edit.') ? this.editRule : this.newRule;
            const raw = String(form[field] ?? '').trim();
            if (raw === '') { this.fieldErrs[k] = false; return; }  // 留空不算越界（同参数模块）
            const v = Number(raw);
            this.fieldErrs[k] = !(Number.isFinite(v) && v >= range.min && v <= range.max);
        },
        openCreate() {
            this.fieldErrs = {}; this.activeHelp = '';
            this.showForm = !this.showForm;
        },
        // 提交前统一校验：越界则不下发（服务端无范围校验，放任会写脏数据）
        formValid(prefix) {
            for (const f of Object.keys(this.ranges)) this.validateField(`${prefix}.${f}`);
            const bad = Object.keys(this.ranges).some(f => this.fieldErrs[`${prefix}.${f}`]);
            if (bad) {
                const el = document.getElementById(prefix === 'edit' ? 'edit-result' : 'create-result');
                if (el) el.innerHTML = '<p style="color:red">❌ 存在超出可调范围的参数，请修正后再提交。</p>';
            }
            return !bad;
        },

        // ── 子字段下拉：鼠标与键盘共用同一套候选态 ──
        openSubField(target) {
            this.subFieldTarget = target;
            this.fetchSubFields(target);
        },
        pickSubField(val) {
            const form = this.subFieldTarget === 'edit' ? this.editRule : this.newRule;
            form.sub_field = val;
            this.subFieldOpen = false;
            this.subFieldIndex = -1;
        },
        onSubFieldArrow(ev, step) {
            if (!this.subFieldOpen || this.subFieldSuggestions.length === 0) return;
            ev.preventDefault();
            const n = this.subFieldSuggestions.length;
            // 取模支持上下循环；-1 起步时 ↓ 落到 0、↑ 落到末项
            this.subFieldIndex = ((this.subFieldIndex + step) % n + n) % n;
        },
        onSubFieldEnter(ev) {
            // 下拉未开时不拦截，让 Enter 照常提交表单
            if (!this.subFieldOpen || this.subFieldSuggestions.length === 0) return;
            ev.preventDefault();
            this.pickSubField(this.subFieldSuggestions[this.subFieldIndex < 0 ? 0 : this.subFieldIndex]);
        },

        fetchSubFields(target) {
            const form = target === 'edit' ? this.editRule : this.newRule;
            this.subFieldIndex = -1;
            if (!form.dimension) { this.subFieldSuggestions = []; this.subFieldOpen = false; return; }
            clearTimeout(this.subFieldTimer);
            this.subFieldTimer = setTimeout(async () => {
                try {
                    const resp = await fetch(`/rules/sub-fields?dimension=${form.dimension}`);
                    const all = await resp.json();
                    // 按已键入内容过滤
                    const typed = (form.sub_field || '').trim();
                    this.subFieldSuggestions = typed
                        ? all.filter(s => s.toLowerCase().includes(typed.toLowerCase()))
                        : all;
                    this.subFieldOpen = this.subFieldSuggestions.length > 0;
                    this.subFieldIndex = -1;
                } catch (e) {
                    console.error('获取子字段列表失败:', e);
                }
            }, 150);
        },

        hideSubFieldDropdown() {
            // 延迟关闭以便 click 事件能触发
            setTimeout(() => { this.subFieldOpen = false; }, 200);
        },

        openEdit(dataset) {
            this.fieldErrs = {}; this.activeHelp = ''; this.subFieldIndex = -1;  // 清上一轮校验态
            this.editRule = {
                id: dataset.id,
                dimension: dataset.dimension,
                sub_field: dataset.sub_field || '',
                pattern: dataset.pattern,
                label: dataset.label || '',
                match_type: dataset.match_type,
                priority: parseInt(dataset.priority) || 0,
                threshold: parseFloat(dataset.threshold) || 0.6,
            };
            this.showEditForm = true;
        },

        async updateRule() {
            if (!this.formValid('edit')) return;
            const fd = new FormData();
            fd.append('dimension', this.editRule.dimension);
            fd.append('sub_field', this.editRule.sub_field);
            fd.append('pattern', this.editRule.pattern);
            fd.append('match_type', this.editRule.match_type);
            fd.append('label', this.editRule.label || '');
            fd.append('priority', this.editRule.priority);
            fd.append('threshold', this.editRule.threshold);
            try {
                const resp = await fetch(`/rules/${this.editRule.id}`, {
                    method: 'PUT',
                    body: fd,
                });
                if (resp.ok) {
                    this.showEditForm = false;
                    document.getElementById('edit-result').innerHTML = '';
                    if (this.viewMode === 'label') {
                        // 分组视图：行的列结构不同于平铺片段，且改标签会换组 → 整体重载
                        this.refreshAfterAction();
                    } else {
                        const html = await resp.text();
                        const rowEl = document.querySelector(`tr:has(button[data-id="${this.editRule.id}"])`);
                        if (rowEl) {
                            const parent = rowEl.parentElement;  // outerHTML 后 rowEl 脱离 DOM，提前保存引用
                            rowEl.outerHTML = html;
                            if (window.htmx) htmx.process(parent);
                        }
                        // fetch 成功路径显式派发质量报表刷新（与 htmx:afterSettle dispatcher 互补）
                        document.body.dispatchEvent(new CustomEvent('rulesQualityRefresh'));
                    }
                } else {
                    const err = await resp.json();
                    document.getElementById('edit-result').innerHTML = `<p style="color:red">❌ ${err.detail || '编辑失败'}</p>`;
                }
            } catch (e) {
                document.getElementById('edit-result').innerHTML = `<p style="color:red">❌ 编辑失败: ${e.message}</p>`;
            }
        },

        async createRule() {
            if (!this.formValid('new')) return;
            const fd = new FormData();
            for (const [k, v] of Object.entries(this.newRule)) fd.append(k, v);
            const resp = await fetch('/rules/create', {method:'POST', body:fd});
            const html = await resp.text();
            document.getElementById('create-result').innerHTML = html;
            this.showForm = false;
            this.newRule = {dimension:'', sub_field:'', pattern:'', match_type:'keyword', priority:0, threshold:0.6, label:''};
            this.fieldErrs = {}; this.activeHelp = '';
            // fetch 成功路径显式派发质量报表刷新（与 htmx:afterSettle dispatcher 互补）
            document.body.dispatchEvent(new CustomEvent('rulesQualityRefresh'));
            // 触发列表刷新
            setTimeout(() => this.loadRules(), 500);
        },
    }));

});
</script>
<script>
// 规则变更后自动刷新：
// - 普通 /rules 请求（新增/编辑/删除/启停）→ 刷新质量报表（报表挂载区已 hx-trigger rulesQualityRefresh）
// - 报表批量动作 /rules/quality/batch → 刷新下方规则列表（质量报表由批量按钮 hx-target 自刷，避免循环）
document.body.addEventListener('htmx:afterSettle', function (evt) {
    var path = (evt.detail && evt.detail.requestConfig && evt.detail.requestConfig.path) || '';
    // 运行AI分类完成后刷新按钮旁的待处理计数
    if (path === '/classify/run') {
        document.body.dispatchEvent(new CustomEvent('classifyStatsRefresh'));
    }
    if (path.indexOf('/rules') !== 0) return;
    if (path.indexOf('/rules/quality/batch') === 0) {
        document.body.dispatchEvent(new CustomEvent('rulesListRefresh'));
        return;
    }
    if (path.indexOf('/rules/quality') === -1) {
        document.body.dispatchEvent(new CustomEvent('rulesQualityRefresh'));
    }
});
</script>
