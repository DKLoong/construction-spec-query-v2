<!-- 两栏条文编辑页（左编辑 | 右实时预览），仿 OCR 审查页布局 -->
<div x-data="clauseEditor()" class="ocr-review">
    <h2>✏️ 编辑条文
        <small x-text="specLabel" style="color:var(--pico-muted-color);font-size:0.8rem"></small>
    </h2>

    <!-- 条文号 / 标题 -->
    <div class="review-toolbar">
        <div style="display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap">
            <input type="text" x-model="clauseNo" placeholder="条文号" style="width:160px">
            <input type="text" x-model="title" placeholder="标题" style="flex:1;min-width:240px">
        </div>
    </div>

    <!-- 左右双栏：编辑 | 预览（同步滚动） -->
    <div class="review-panels">
        <textarea x-model="content" @input="updatePreview()" @scroll="syncScroll($event)"
                  class="review-editor" spellcheck="false"></textarea>
        <div x-html="renderedHtml" class="review-preview" id="review-preview"></div>
    </div>

    <!-- 确认 / 取消（右下角） -->
    <div style="margin-top:1rem;padding-top:1rem;border-top:1px solid var(--pico-muted-border-color);
                display:flex;justify-content:space-between;align-items:center">
        <small style="color:var(--pico-muted-color)">编辑条文号、标题与内容，右侧实时预览效果</small>
        <div style="display:flex;gap:0.75rem;align-items:center">
            <button type="button" @click="save()" :disabled="saving">✅ 确认保存</button>
            <button type="button" class="secondary" @click="cancel()">✖ 取消</button>
        </div>
    </div>
    <div id="edit-result" style="margin-top:0.5rem"></div>
</div>

<script>
// 条文数据以 JS 字面量嵌入：tojson 输出合法 JSON，由 JS 引擎解码（\uXXXX、\n 还原为真实字符）。
// 不要改用 data-* 属性 + dataset 直读——tojson 的转义序列经 dataset 返回字面字符串导致乱码。
window.__clauseEditData = {
    specId: {{ spec_id | tojson }},
    clauseId: {{ clause.id | tojson }},
    clauseNo: {{ clause.clause_no | tojson }},
    title: {{ clause.title | tojson }},
    content: {{ clause.content | tojson }},
    dim4: {{ clause.dim4_specialty | tojson }},
    dim5: {{ clause.dim5_location | tojson }},
    dim6: {{ clause.dim6_material | tojson }},
    specCode: {{ clause.spec_code | tojson }},
    specTitle: {{ clause.spec_title | tojson }},
};

document.addEventListener('alpine:init', () => {
    Alpine.data('clauseEditor', () => ({
        clauseNo: '',
        title: '',
        content: '',
        dim4: '',
        dim5: '',
        dim6: '',
        specLabel: '',
        renderedHtml: '',
        saving: false,
        specId: null,
        clauseId: null,

        init() {
            const d = window.__clauseEditData || {};
            this.specId = d.specId;
            this.clauseId = d.clauseId;
            this.clauseNo = d.clauseNo || '';
            this.title = d.title || '';
            this.content = d.content || '';
            // 保存时原样回传分类字段，避免 PUT 默认空值清空已有分类
            this.dim4 = d.dim4 || '';
            this.dim5 = d.dim5 || '';
            this.dim6 = d.dim6 || '';
            this.specLabel = [d.specCode, d.specTitle].filter(Boolean).join(' ');
            this.updatePreview();
        },

        // 实时预览：条文号 + 标题 + 内容（统一 mdRender 渲染，图片改写为 /specs/{specId}/）
        updatePreview() {
            const md = [
                this.clauseNo ? `**${this.clauseNo}**` : '',
                this.title ? `### ${this.title}` : '',
                this.content || '',
            ].filter(Boolean).join('\n\n');
            try {
                this.renderedHtml = window.mdRender.renderHtml(md, `/specs/${this.specId}/`);
            } catch (e) {
                this.renderedHtml = '<p style="color:red">渲染错误</p>';
            }
        },

        // 编辑框与预览框同步滚动（按比例映射）
        syncScroll(event) {
            const preview = document.getElementById('review-preview');
            if (!preview) return;
            const max = event.target.scrollHeight - event.target.clientHeight;
            if (max <= 0) return;
            const ratio = event.target.scrollTop / max;
            preview.scrollTop = ratio * (preview.scrollHeight - preview.clientHeight);
        },

        async save() {
            if (this.saving) return;
            this.saving = true;
            try {
                const fd = new FormData();
                fd.append('clause_no', this.clauseNo);
                fd.append('title', this.title);
                fd.append('content', this.content);
                fd.append('dim4_specialty', this.dim4);
                fd.append('dim5_location', this.dim5);
                fd.append('dim6_material', this.dim6);
                const resp = await fetch(`/specs/${this.specId}/clauses/${this.clauseId}`, {
                    method: 'PUT',
                    body: fd,
                });
                if (!resp.ok) throw new Error('服务返回 ' + resp.status);
                // 标记返回后刷新条文列表，再 history.back() 回操作前页面；
                // 保留编辑前记录的滚动位置（scroll），否则保存返回后跳回顶部
                let prev = {};
                try { prev = JSON.parse(sessionStorage.getItem('clauseEditReturn') || '{}'); } catch (e) { prev = {}; }
                sessionStorage.setItem('clauseEditReturn', JSON.stringify({
                    edited: true,
                    specId: this.specId,
                    scroll: prev.scroll || 0,
                }));
                window.history.back();
            } catch (e) {
                const box = document.getElementById('edit-result');
                if (box) box.innerHTML = `<p style="color:red">保存失败: ${e.message}</p>`;
                this.saving = false;
            }
        },

        cancel() {
            window.history.back();
        },
    }));
});
</script>
