<!-- 维护界面：三 Tab（健康检查 / 导出备份 / 日志管理占位） -->
<div x-data="{ tab: 'health' }" style="padding:1rem">
    <h2>🛠 知识库维护</h2>
    <div style="display:flex;gap:0.5rem;margin:1rem 0;flex-wrap:wrap">
        <button class="outline" style="font-size:0.8rem"
                :class="tab==='health' ? 'contrast' : ''" @click="tab='health'">📋 健康检查</button>
        <button class="outline" style="font-size:0.8rem"
                :class="tab==='export' ? 'contrast' : ''" @click="tab='export'">💾 导出备份</button>
        <button class="outline" style="font-size:0.8rem"
                :class="tab==='logs' ? 'contrast' : ''" @click="tab='logs'">📜 日志管理</button>
        <button class="outline" style="font-size:0.8rem"
                :class="tab==='qalogs' ? 'contrast' : ''" @click="tab='qalogs'">📡 QA 日志</button>
    </div>

    <!-- Tab 1: 健康检查 -->
    <div x-show="tab==='health'">
        <button hx-post="/maintenance/health-check" hx-target="#health-result" hx-swap="innerHTML"
                style="background:var(--pico-primary-background);border-color:var(--pico-primary-background);color:var(--pico-primary-inverse)">
            🔍 运行健康检查
        </button>
        <div id="health-result" style="margin-top:1rem"
             hx-post="/maintenance/health-check" hx-trigger="load" hx-swap="innerHTML"></div>
    </div>

    <!-- Tab 2: 导出备份 -->
    <div x-show="tab==='export'">
        <p style="color:var(--pico-muted-color);font-size:0.85rem">备份/导出为 JSON 或 SQLite 单文件，用于迁移环境或存档。</p>
        <div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-top:0.8rem">
            <button hx-post="/maintenance/backup" hx-target="#export-result" hx-swap="innerHTML"
                    hx-confirm="确定执行 SQLite 备份？" class="outline">💾 SQLite 备份</button>
            <a href="/maintenance/export/rules"><button class="outline">📋 导出分类规则</button></a>
            <a href="/maintenance/export/review-queue"><button class="outline">📝 导出复核队列</button></a>
            <button hx-post="/maintenance/fts-optimize" hx-target="#export-result" hx-swap="innerHTML"
                    class="outline">🧩 FTS5 optimize</button>
        </div>
        <div id="export-result" style="margin-top:0.8rem"></div>
    </div>

    <!-- Tab 3: 日志管理 -->
    <div x-show="tab==='logs'">
        {% include "partials/logs_panel.html" %}
    </div>

    <!-- Tab 4: QA 日志（只读） -->
    <div x-show="tab==='qalogs'">
        {% include "partials/qa_logs_panel.html" %}
    </div>

    <!-- 重建向量索引进度环：后台重建期间覆盖全视口，圆环显示真实进度 + 中央百分比，完成自动消失 -->
    <div id="rebuild-overlay" class="rebuild-overlay" style="display:none">
        <div class="rebuild-ring" id="rebuild-ring" role="progressbar" aria-valuemin="0" aria-valuemax="100">
            <div class="rebuild-pct" id="rebuild-pct">0%</div>
        </div>
        <div class="rebuild-spinner-text" id="rebuild-text">正在同步向量索引…</div>
    </div>
</div>
<script>
// 重建向量索引：进度环由全局 RebuildTracker（rebuild.js，base.html 加载）驱动——
// 轮询跨页存活、完成 toast 全局弹；本页只负责启动 + 展示/隐藏进度环 + 完成后刷新健康结果。
window.startRebuild = async function () {
    if (!confirm('将清空并全量重建向量索引（耗时较长，可在后台进行，完成后将提醒你），期间搜索精度有所下降，确定继续？')) return;
    let taskId = '';
    try {
        const resp = await fetch('/maintenance/rebuild-vectors', { method: 'POST' });
        const data = await resp.json();
        taskId = data.task_id;
    } catch (e) {
        alert('启动重建失败：' + e.message);
        return;
    }
    if (!taskId) { alert('启动重建失败'); return; }
    setRebuildPct(0);
    showRebuildOverlay();
    if (window.RebuildTracker) RebuildTracker.start(taskId);
};

function showRebuildOverlay() {
    const ov = document.getElementById('rebuild-overlay');
    if (ov) ov.style.display = 'flex';
}
function hideRebuildOverlay() {
    const ov = document.getElementById('rebuild-overlay');
    if (ov) ov.style.display = 'none';
}
function setRebuildPct(p) {
    const ring = document.getElementById('rebuild-ring');
    const pct = document.getElementById('rebuild-pct');
    if (!ring || !pct) return;
    p = Math.max(0, Math.min(100, Number(p) || 0));
    pct.textContent = p + '%';
    ring.style.background = 'conic-gradient(#46a758 ' + p + '%, rgba(70,167,88,.15) 0)';
    if (ring.setAttribute) ring.setAttribute('aria-valuenow', String(p));
}
function refreshHealthResult() {
    if (window.htmx) htmx.ajax('POST', '/maintenance/health-check',
        { target: '#health-result', swap: 'innerHTML' });
}

// 全局重建进度（tracker 在任意页面轮询并广播）→ 有环元素时展示进度
window.addEventListener('rebuild-progress', function (e) {
    const p = e.detail || {};
    if (p.status === 'pending' || p.status === 'running') {
        showRebuildOverlay();
        setRebuildPct(p.progress || 0);
        const t = document.getElementById('rebuild-text');
        if (t) t.textContent = p.message || '正在同步向量索引…';
    }
});
// 完成/失败（toast 由 tracker 全局弹）→ 隐藏环 + 刷新健康结果
window.addEventListener('rebuild-finished', function (e) {
    hideRebuildOverlay();
    const p = e.detail || {};
    if (p.status === 'error') { alert('重建失败：' + (p.message || '未知错误')); }
    refreshHealthResult();
});
// 切回本页恢复：sessionStorage 仍有进行中任务 → 显示环（进度由事件流继续更新）
(function () {
    if (window.RebuildTracker && RebuildTracker.active) {
        setRebuildPct(0);
        showRebuildOverlay();
    }
})();
</script>
